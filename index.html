<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>סוכני הסייבר — משחק בטיחות ברשת</title>
<meta name="description" content="משחק חינוכי ללימוד בטיחות ברשת לילדים ובני נוער.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<!-- PWA -->
<link rel="manifest" href="/manifest.webmanifest" id="manifestLink">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<!-- iOS home-screen app -->
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" id="appleTouchIcon">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="סוכני הסייבר" id="appleTitle">
<script>
  /* Swap the PWA identity — manifest, title, and (for the teacher) home-screen icon — BEFORE the
     user gets a chance to "Add to Home Screen", so whatever gets saved relaunches into the right
     place instead of always landing on the bare kids' start screen.
     - ?teacher=1 gets its own static manifest (fixed start_url, teacher-branded icon).
     - ?class=CODE gets a manifest generated on the fly by /api/manifest, with THIS class's code
       baked into start_url — otherwise every class link shared a single static manifest.webmanifest
       (start_url "/"), so any class's installed icon reopened to the generic start screen, forgetting
       which class it was ever for. */
  var params = new URLSearchParams(location.search);
  if (params.get('teacher')) {
    document.title = 'סוכני הסייבר — ניהול כיתות';
    document.getElementById('manifestLink').href = '/manifest-teacher.webmanifest';
    document.getElementById('appleTouchIcon').href = '/icons/teacher-apple-touch-icon.png';
    document.getElementById('appleTitle').content = 'ניהול כיתות';
  } else if (params.get('class')) {
    var className = params.get('cn') || '';
    document.title = 'סוכני הסייבר' + (className ? ' — ' + className : '');
    document.getElementById('manifestLink').href = '/api/manifest?' + params.toString();
    document.getElementById('appleTitle').content = className || 'סוכני הסייבר';
  }
</script>
<style>
  /* Legacy names still used inline in a few templates and in the world data; they now resolve to
     Apple's dark-mode system colours, so leftovers match the theme instead of the old neon. */
  :root{
    --bg:var(--c-bg);
    --bg2:var(--c-bg-elevated);
    --panel:var(--glass-bg);
    --panel-solid:var(--c-bg-elevated);
    --ink:var(--c-label);
    --muted:var(--c-label-2);
    --cyan:#64d2ff;
    --purple:#bf5af2;
    --green:#30d158;
    --pink:#ff375f;
    --yellow:#ffd60a;
    --orange:#ff9f0a;
    --good:var(--c-success);
    --bad:var(--c-danger);
    --line:var(--c-separator);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  html{height:-webkit-fill-available}
  body{
    height:100vh;height:100dvh;
    overscroll-behavior:contain;
    font-family:var(--font-ui);
    background:
      radial-gradient(700px 520px at 85% -8%, rgba(48,213,200,.20), transparent 62%),
      radial-gradient(640px 520px at 8% 108%, rgba(94,92,230,.18), transparent 62%),
      var(--c-bg);
    -webkit-font-smoothing:antialiased;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }

  /* app fills the viewport exactly; HUD stays pinned, #screen is the only scrolling region */
  #app{position:relative;z-index:1;max-width:820px;margin:0 auto;
       height:100vh;height:100dvh;
       display:flex;flex-direction:column;overflow:hidden;
       padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right))
               calc(10px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
  #screen{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
          display:flex;flex-direction:column}
  canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
  .version-tag{position:fixed;bottom:4px;left:6px;z-index:2;font-size:9px;letter-spacing:.02em;
    color:rgba(143,160,200,.4);font-family:ui-monospace,'Courier New',monospace;
    direction:ltr;pointer-events:none;user-select:none}

  h1,h2,h3{margin:0}
  .neon{text-shadow:none}                      /* kept as a hook in markup; HIG has no glow */
  button{font-family:inherit;cursor:pointer;border:none;color:inherit}
  .icon{width:1em;height:1em;flex-shrink:0}

  /* ---------- HUD (Apple HIG) ---------- */
  #hud{display:none;flex-shrink:0;gap:var(--sp-3);align-items:center;justify-content:space-between;flex-wrap:wrap;
       margin-bottom:var(--sp-3);padding:var(--sp-2) var(--sp-3) var(--sp-2) var(--sp-4);border-radius:var(--r-xl);color:var(--c-label);
       background:var(--glass-bg);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
       border:1px solid var(--c-hairline)}
  .hud-rank{font-weight:var(--fw-semibold);font-size:var(--fs-subhead);color:var(--c-label);line-height:1.25}
  .hud-rank small{display:block;color:var(--c-label-2);font-weight:var(--fw-regular);font-size:var(--fs-caption)}
  .hearts{display:flex;gap:3px;font-size:20px}
  .hearts .life{color:var(--c-danger);display:grid;transition:transform var(--dur-fast) var(--ease-spring)}
  .hearts .life.lost{color:var(--c-label-3)}
  .hud-score{font-weight:var(--fw-bold);font-size:var(--fs-title3);color:var(--c-label);font-variant-numeric:tabular-nums}
  .hud-score small{font-size:var(--fs-caption);color:var(--c-label-2);font-weight:var(--fw-regular)}
  .xpwrap{flex:1 1 140px;min-width:120px}
  .xpbar{height:6px;border-radius:var(--r-full);background:var(--c-fill);overflow:hidden}
  .xpfill{height:100%;width:0;border-radius:var(--r-full);background:var(--c-accent);
          transition:width var(--dur-slow) var(--ease-default)}
  .xplabel{font-size:var(--fs-caption);color:var(--c-label-2);margin-top:4px;text-align:center}
  #muteBtn{width:var(--touch-min);height:var(--touch-min);border-radius:50%;background:var(--c-fill);color:var(--c-label);
           font-size:20px;display:grid;place-items:center;transition:transform var(--dur-instant) var(--ease-out)}
  #muteBtn:active{transform:scale(.94)}
  #muteBtn:focus-visible{outline:none;box-shadow:0 0 0 4px var(--c-accent-ring)}
  #screen{scrollbar-width:thin;scrollbar-color:var(--c-separator) transparent}
  #screen::-webkit-scrollbar{width:8px}
  #screen::-webkit-scrollbar-thumb{background:var(--c-separator);border-radius:4px}

  /* ---------- Shared surfaces (Apple HIG, tokens in theme.css) ---------- */
  .card{background:var(--glass-bg);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
        border:1px solid var(--c-hairline);box-shadow:var(--glass-shadow);border-radius:var(--r-2xl);
        padding:var(--sp-5);flex-shrink:0;color:var(--c-label)}
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){ .card{background:var(--c-bg-elevated)} }
  .center{text-align:center}
  /* short "modal-style" cards (start/certificate/completion) center in the viewport when they
     don't fill it; auto margins collapse to 0 (normal top flow) once content overflows */
  .card.center,.cert{margin-block:auto}
  .card h2{font-size:var(--fs-title2);font-weight:var(--fw-bold);line-height:1.25;color:var(--c-label)}
  .subtitle{color:var(--c-label-2);margin-top:var(--sp-2);font-size:var(--fs-subhead);line-height:1.5}
  .name-label{display:block;margin-top:var(--sp-4);font-size:var(--fs-footnote);font-weight:var(--fw-semibold);color:var(--c-label-2)}
  /* ---------- Start screen — Apple HIG (scoped; tokens live in theme.css) ---------- */
  .scr-start{max-width:440px;width:100%;margin-inline:auto;padding:var(--sp-8) var(--sp-6) var(--sp-6);
    border-radius:var(--r-2xl);color:var(--c-label);animation:startIn var(--dur-slow) var(--ease-default) both;
    background:var(--glass-bg);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
    border:1px solid var(--c-hairline);box-shadow:var(--glass-shadow)}
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){ .scr-start{background:var(--c-bg-elevated)} }
  @keyframes startIn{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
  .start-icon{display:block;margin:0 auto;width:84px;height:84px;border-radius:19px;
    box-shadow:0 10px 30px rgba(48,213,200,.18),0 0 0 1px var(--c-hairline)}
  .start-title{margin-top:var(--sp-5);font-size:var(--fs-large);font-weight:var(--fw-bold);line-height:1.15;
    letter-spacing:-.01em;color:var(--c-label)}
  .start-sub{margin:var(--sp-2) 0 0;font-size:var(--fs-subhead);color:var(--c-label-2)}
  .start-topics{list-style:none;margin:var(--sp-6) 0 0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:var(--sp-2)}
  .start-topics li{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-full);
    background:var(--c-fill-2);font-size:var(--fs-footnote);color:var(--c-label-2)}
  .start-topics li .icon{color:var(--c);width:15px;height:15px}
  .start-label{display:block;margin-top:var(--sp-8);text-align:start;font-size:var(--fs-footnote);
    font-weight:var(--fw-semibold);color:var(--c-label-2);padding-inline:var(--sp-1)}
  .scr-start input#nameInput{width:100%;min-height:50px;margin-top:var(--sp-2);padding:var(--sp-3) var(--sp-4);
    border-radius:var(--r-md);background:var(--c-fill);border:1px solid transparent;color:var(--c-label);
    font:inherit;font-size:var(--fs-body);text-align:start;box-shadow:none;
    transition:border-color var(--dur-fast) var(--ease-out),box-shadow var(--dur-fast) var(--ease-out)}
  .scr-start input#nameInput::placeholder{color:var(--c-label-2)}
  .scr-start input#nameInput:focus{outline:none;border-color:var(--c-accent);box-shadow:0 0 0 4px var(--c-accent-ring)}
  .scr-start .btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;
    padding:var(--sp-3) var(--sp-6);border-radius:var(--r-full);font-size:var(--fs-body);font-weight:var(--fw-semibold);
    box-shadow:none;border:none;transition:transform var(--dur-instant) var(--ease-out),background-color var(--dur-fast) var(--ease-out)}
  .scr-start .btn:not(:disabled):active{transform:scale(.97);box-shadow:none}
  .scr-start .start-cta{margin-top:var(--sp-4);background:var(--c-accent);color:var(--c-on-accent)}
  .scr-start .start-cta:hover{background:var(--c-accent-press)}
  .scr-start .start-secondary{margin-top:var(--sp-3);background:var(--c-accent-soft);color:var(--c-accent)}
  .scr-start .btn:focus-visible{outline:none;box-shadow:0 0 0 4px var(--c-accent-ring)}
  .start-note{display:flex;align-items:center;justify-content:center;gap:6px;margin:var(--sp-5) 0 0;
    font-size:var(--fs-footnote);color:var(--c-label-2)}
  .start-note .icon{width:14px;height:14px;flex-shrink:0}
  .start-credit{margin:var(--sp-2) 0 0;font-size:var(--fs-caption);color:var(--c-label-2)}
  /* A class like .btn sets its own display, which silently beats the browser's default
     rule for [hidden] — an element we hid in markup would still show up. Make hidden win. */
  [hidden]{display:none !important}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);min-height:50px;
       padding:var(--sp-3) var(--sp-6);border-radius:var(--r-full);border:none;
       font-size:var(--fs-body);font-weight:var(--fw-semibold);text-decoration:none;
       background:var(--c-accent);color:var(--c-on-accent);
       transition:transform var(--dur-instant) var(--ease-out),background-color var(--dur-fast) var(--ease-out),opacity var(--dur-fast) var(--ease-out)}
  .btn:not(:disabled):active{transform:scale(.97)}
  .btn:focus-visible{outline:none;box-shadow:0 0 0 4px var(--c-accent-ring)}
  .btn.big{display:flex;width:100%;margin-top:var(--sp-4)}
  .btn.ghost{background:var(--c-fill);color:var(--c-label)}
  .btn.adv-btn{background:var(--c-accent-soft);color:var(--c-accent)}
  .btn.danger{background:rgba(255,69,58,.16);color:var(--c-danger)}
  /* a disabled button must not look tappable (sort "check" starts disabled, join button locks while fetching) */
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .hint{color:var(--c-label-2);font-size:var(--fs-footnote);margin-top:var(--sp-3);line-height:1.45}
  .code-err{min-height:20px;margin-top:var(--sp-2);color:var(--c-danger);font-size:var(--fs-footnote);font-weight:var(--fw-semibold)}
  .credit{color:var(--c-label-2);font-size:var(--fs-caption);margin-top:var(--sp-4)}
  .link-btn{background:none;color:var(--c-accent);font-size:var(--fs-subhead);font-weight:var(--fw-semibold);
            padding:var(--sp-2) var(--sp-3);margin-top:var(--sp-2);min-height:var(--touch-min)}
  .tag{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-footnote);padding:6px 12px;border-radius:var(--r-full);
       background:var(--c-fill-2);color:var(--c-label-2);margin:3px}
  @media (hover: hover) and (pointer: fine){
    .btn:not(:disabled):hover{filter:brightness(1.08)}
    .link-btn:hover{text-decoration:underline}
  }
  /* ---------- Management (Apple HIG) ---------- */
  .code-field{width:100%;min-height:56px;margin-top:var(--sp-2);padding:var(--sp-3);border-radius:var(--r-md);
    background:var(--c-fill);border:1px solid transparent;color:var(--c-label);direction:ltr;
    font:inherit;font-size:28px;font-weight:var(--fw-bold);text-align:center;letter-spacing:.4em;font-variant-numeric:tabular-nums;
    transition:border-color var(--dur-fast) var(--ease-out),box-shadow var(--dur-fast) var(--ease-out)}
  .code-field::placeholder{color:var(--c-label-2);letter-spacing:.4em}
  .code-field:focus{outline:none;border-color:var(--c-accent);box-shadow:0 0 0 4px var(--c-accent-ring)}
  .code-show{margin:var(--sp-5) 0 var(--sp-2);padding:var(--sp-4);border-radius:var(--r-lg);background:var(--c-fill-2);direction:ltr}
  .code-show .num{display:block;font-size:clamp(34px,11vw,52px);font-weight:var(--fw-bold);letter-spacing:.3em;color:var(--c-accent)}
  .myclass-del{flex-shrink:0;background:none;color:var(--c-label-2);font-size:18px;min-height:var(--touch-min);min-width:var(--touch-min);
    border-radius:50%;display:grid;place-items:center}
  .recap-title{margin-top:var(--sp-5);font-weight:var(--fw-semibold);font-size:var(--fs-footnote);color:var(--c-label-2)}
  .fast-note{margin:var(--sp-3) auto 0;max-width:32ch;padding:6px 14px;border-radius:var(--r-full);
    background:rgba(48,209,88,.14);color:var(--c-success);font-size:var(--fs-footnote);font-weight:var(--fw-semibold)}
  .takeaway{margin:var(--sp-2) auto 0;max-width:34ch;font-size:var(--fs-body);font-weight:var(--fw-semibold);line-height:1.5;
    color:var(--c-label);text-wrap:balance}
  /* onboarding = one grouped list, rows split by hairlines */
  .onboard-list{display:flex;flex-direction:column;margin-top:var(--sp-5);text-align:start;
    background:var(--c-fill-2);border-radius:var(--r-lg);overflow:hidden}
  .onboard-step{display:flex;gap:var(--sp-3);align-items:flex-start;padding:var(--sp-4)}
  .onboard-step+.onboard-step{border-top:1px solid var(--c-separator)}
  .onboard-num{flex:0 0 28px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
    font-size:var(--fs-footnote);font-weight:var(--fw-bold);color:var(--c-accent);background:var(--c-accent-soft)}
  .onboard-text{font-size:var(--fs-subhead);line-height:1.5;color:var(--c-label-2)}
  .onboard-text b{color:var(--c-label);font-weight:var(--fw-semibold)}
  .onboard-text .icon{color:var(--c-accent)}
  .link-box{margin-top:var(--sp-2);background:var(--c-fill);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);
    font-family:var(--font-mono);font-size:var(--fs-footnote);color:var(--c-label-2);word-break:break-all;text-align:center;direction:ltr}
  .btn-row{display:flex;gap:var(--sp-2);margin-top:var(--sp-2)}
  .btn-row .btn{flex:1;margin-top:0;font-size:var(--fs-subhead);padding:var(--sp-3) var(--sp-3)}
  .teach-tip{margin-top:var(--sp-3);padding:var(--sp-3) var(--sp-4);border-radius:var(--r-md);background:var(--c-fill-2);
    color:var(--c-label-2);font-size:var(--fs-subhead);line-height:1.55;text-align:start}
  .teach-tip b{color:var(--c-accent);font-weight:var(--fw-semibold)}
  .topic-bar-row{margin-top:var(--sp-3)}
  .topic-bar-head{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:6px}
  .topic-bar-icon{width:20px;height:20px;flex-shrink:0}
  .topic-bar-icon .icon{width:100%;height:100%}
  .topic-bar-title{flex:1;min-width:0;font-weight:var(--fw-semibold);font-size:var(--fs-subhead);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--c-label)}
  .topic-bar-pct{font-weight:var(--fw-semibold);font-size:var(--fs-subhead);color:var(--c-label);font-variant-numeric:tabular-nums;unicode-bidi:isolate}
  .topic-bar-track{height:8px;border-radius:var(--r-full);background:var(--c-fill);overflow:hidden}
  .topic-bar-fill{height:100%;border-radius:var(--r-full);transition:width var(--dur-slow) var(--ease-default)}
  /* class list = grouped rows */
  .myclass-list{display:flex;flex-direction:column;margin-top:var(--sp-4);background:var(--c-fill-2);border-radius:var(--r-lg);overflow:hidden}
  .myclass-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--sp-2) var(--sp-3);cursor:pointer;
      padding:var(--sp-3) var(--sp-4);min-height:60px;transition:background-color var(--dur-fast) var(--ease-out)}
  .myclass-row+.myclass-row{border-top:1px solid var(--c-separator)}
  .myclass-row:active{background:var(--c-fill-2)}
  .myclass-info{min-width:0;text-align:start;flex:1 1 170px}
  .myclass-name{font-weight:var(--fw-semibold);font-size:var(--fs-body);color:var(--c-label);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .myclass-stats{font-size:var(--fs-footnote);color:var(--c-label-2);margin-top:2px}
  .myclass-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;margin-inline-start:auto}
  .new-class{display:flex;gap:var(--sp-2);margin-top:var(--sp-4)}
  .new-class input{flex:1;min-width:0;min-height:50px;padding:var(--sp-3) var(--sp-4);border-radius:var(--r-md);background:var(--c-fill);
    border:1px solid transparent;color:var(--c-label);font:inherit;font-size:var(--fs-body);text-align:start}
  .new-class input::placeholder{color:var(--c-label-2)}
  .new-class input:focus{outline:none;border-color:var(--c-accent);box-shadow:0 0 0 4px var(--c-accent-ring)}
  .new-class .btn{width:auto;margin:0;flex-shrink:0}

  /* ---------- Map (Apple HIG) ---------- */
  .map-title{text-align:center;margin-bottom:var(--sp-2)}
  .map-title h2{font-size:var(--fs-title1);font-weight:var(--fw-bold);color:var(--c-label)}
  .map-title h2 span{color:var(--c-accent)!important}
  .map{position:relative;margin:var(--sp-4) 0}
  .station{display:flex;align-items:center;gap:var(--sp-4);margin:0;position:relative;min-height:76px;
    padding:var(--sp-3) var(--sp-4);border-radius:var(--r-xl);color:var(--c-label);
    background:var(--glass-bg);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
    border:1px solid var(--c-hairline);transition:transform var(--dur-instant) var(--ease-out),border-color var(--dur-fast) var(--ease-out)}
  .station.locked{opacity:.45}
  /* the world you play next is the one thing on the map marked in the accent */
  .station.next{border-color:var(--c-accent);box-shadow:0 0 0 1px var(--c-accent),0 12px 30px rgba(48,213,200,.14)}
  .st-emoji{font-size:26px;width:52px;height:52px;flex:0 0 52px;display:grid;place-items:center;border-radius:14px;
    position:relative;z-index:1;color:var(--c);background:color-mix(in srgb, var(--c) 16%, transparent)}
  .st-body{flex:1;min-width:0}

<body>

<script>

      { type:'sort',
        text:'גרור ומיין: חזקה או חלשה?',

        items:[
          {t:'123456',bin:1},{t:'aA9!kLm2#',bin:0},
          {t:'noa2016',bin:1},{t:'Tapu@ch8Yarok',bin:0}
        ],
        explain:'סיסמאות קצרות או שמבוססות על שם/תאריך קל מאוד לפצח. ערבוב של סוגי תווים ואורך = חוזק.' },
      { type:'quiz',
        text:'חבר טוב מבקש את הסיסמה למשחק שלך כדי "לעזור לך לעבור שלב". מה תעשה?',

/* ---------- teacher identity (one personal code, nothing else) ----------
   A teacher's code IS their identity here: it ties classes to them and works from any device.
   The class list lives on the server keyed by that code, so a cleared browser or a new phone
   loses nothing — type the code again and everything is back. Four digits, deliberately: no
   function in this app can return a child's name to anyone, so what a guessed code reaches is
   class names, PINs and head counts — and short codes are what make this usable in a lesson. */
const TEACHER_KEY='cyberAgentsTeacherCode';
function digitsOnly(s){ return (s||'').replace(/\D/g,''); }
// Grouped in fours if it ever grows past four digits; at the current length this is a no-op.
// The server strips spaces before matching, so a teacher may type it either way.
function formatTeacherCode(c){ return digitsOnly(c).replace(/(\d{4})(?=\d)/g,'$1 '); }
// A four-digit code has nothing left to hide behind a partial mask, so hide all of it.
function maskTeacherCode(c){ return digitsOnly(c) ? '••••' : ''; }
function getTeacherCode(){ try{ return localStorage.getItem(TEACHER_KEY)||''; }catch(e){ return ''; } }
function setTeacherCode(c){ try{ c ? localStorage.setItem(TEACHER_KEY, digitsOnly(c)) : localStorage.removeItem(TEACHER_KEY); }catch(e){} }
function signedIn(){ return !!getTeacherCode(); }
function signOut(){ setTeacherCode(''); }
// The server answers a rejected teacher code with a 400; anything else is the network failing.
function isBadCodeError(e){ return /^sb 4/.test(String((e&&e.message)||'')); }

// A request that never answers is worse than one that fails: it leaves the player watching a
// spinner with no way forward. Cap every call so an unreachable backend surfaces as a real error.
const SB_TIMEOUT_MS=12000;
async function sbFetch(path, opts={}){
  const ctrl=(typeof AbortController!=='undefined') ? new AbortController() : null;
  const timer=ctrl ? setTimeout(()=>ctrl.abort(), SB_TIMEOUT_MS) : null;
  let res;
  try{
    res=await fetch(`${SB_URL}/rest/v1/${path}`, {
      ...opts,
      ...(ctrl?{signal:ctrl.signal}:{}),
      headers:{ 'apikey':SB_KEY, 'Authorization':`Bearer ${SB_KEY}`, 'Content-Type':'application/json', ...(opts.headers||{}) }
    });
  } finally { if(timer) clearTimeout(timer); }
  if(!res.ok) throw new Error('sb '+res.status);
  return res.status===204 ? null : res.json();
}
// All classroom reads/writes go through SECURITY DEFINER Postgres functions (see the
// lock_down_classroom_tables_rpc_only migration) instead of direct table access — the
// classes/students tables have no RLS policies left, so this is the only way in, and it's
// scoped to exactly what each operation needs (e.g. no function ever returns a student's name
// to anyone but that student's own device).
async function sbRpc(fn, params){
  return sbFetch(`rpc/${fn}`,{method:'POST', body:JSON.stringify(params)});
}
// Registers the four digits the teacher picked. Returns false when that code is already
// somebody else's — a normal outcome to be shown, not a failure to be reported as one.
async function createTeacherCode(code){
  return sbRpc('create_teacher', {p_code:digitsOnly(code)});
}
async function createClass(name){
  const rows=await sbRpc('create_class', {p_name:(name||'').trim()||'כיתה ללא שם', p_teacher_code:getTeacherCode()});
  return rows[0];
}
async function findClassByCode(code){
  const rows=await sbRpc('find_class_by_code', {p_code:(code||'').trim()});
  return rows[0]||null;
}
async function deleteClassByCode(code){
  // students cascade-delete automatically (FK on delete cascade) — this removes all of the class's data.
  // Server-side this only succeeds for the teacher whose code owns the class.
  await sbRpc('delete_class_by_code', {p_code:(code||'').trim(), p_teacher_code:getTeacherCode()});
}
// The class list comes from the server keyed by the teacher's code, not from this device — this
// is what makes it survive a cleared browser, a new phone, or any other local failure. It also
// doubles as the check that a typed code is real: an unknown code is rejected here.
async function listMyClasses(){
  return sbRpc('list_my_classes', {p_teacher_code:getTeacherCode()});
}
async function joinClass(code){
  const cls=await findClassByCode(code);
  if(!cls) return null;
  S.classId=cls.id; S.classCode=cls.code; S.className=cls.name; save();
  return cls;
}
async function syncStudentProgress(){
  if(!S.classCode || !S.deviceId) return;
  try{
    await sbRpc('sync_student_progress', {
      p_code:S.classCode, p_device_id:S.deviceId, p_name:S.name||'סוכן/ת',
      p_score:S.score, p_stations_done:S.done.length, p_total_stations:STATIONS.length,
      p_weak_topics:S.weakTopics||[], p_done_stations:S.done||[], p_advanced_done:!!S.advancedDone
    });
  }catch(e){ /* offline / unreachable — solo play is unaffected either way */ }
}
// Class-wide aggregate only — never returns individual names/scores (privacy: this powers the parent-facing link).
// get_class_students_safe() never selects name/device_id at the database level, not just at this call site.
async function loadClassResults(code){
  const cls=await findClassByCode(code);
  if(!cls) return null;
  const students=await sbRpc('get_class_students_safe', {p_code:code});
  const n=students.length;
  const avgScore=n? Math.round(students.reduce((s,x)=>s+x.score,0)/n) : 0;
  const completedCount=students.filter(x=>x.stations_done>=x.total_stations).length;
  const advancedCount=students.filter(x=>x.advanced_done).length;
  const topicStats=STATIONS.map(st=>{
    const completedIt=students.filter(x=>Array.isArray(x.done_stations)&&x.done_stations.includes(st.id));
    const struggled=completedIt.filter(x=>Array.isArray(x.weak_topics)&&x.weak_topics.includes(st.id)).length;
    return { id:st.id, title:st.title, icon:st.icon, color:st.color,
      attempted:completedIt.length, struggled, pct: completedIt.length? Math.round(100*(completedIt.length-struggled)/completedIt.length) : null };
  });
  return { cls, n, avgScore, completedCount, advancedCount, topicStats };
}

let actx=null, master=null;
function ac(){
  if(!actx){ try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain(); master.gain.value=.9;
    const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2600; lp.Q.value=.2;
    master.connect(lp); lp.connect(actx.destination);
  }catch(e){} }
  return actx;
}
function tone(freq,dur,type,vol,when){
  if(S.muted) return; const c=ac(); if(!c) return;
  type=type||'sine'; vol=(vol==null?.12:vol); when=when||0;
  const o=c.createOscillator(), g=c.createGain(), t=c.currentTime+when;
  o.type=type; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+.03);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(master||c.destination); o.start(t); o.stop(t+dur+.05);
}

  if(cur){

    h.innerHTML = Array.from({length:LIVES},(_,i)=>`<span class="${i<cur.lives?'life':'life lost'}">${icon(i<cur.lives?'heartFill':'heart')}</span>`).join('');
    h.setAttribute('aria-label', `${cur.lives} חיים מתוך ${LIVES}`);
    h.style.visibility='visible';
  }
  else { $('#hudHearts').style.visibility='hidden'; }
}
function countDone(){
  // completed challenges = finished stations (full) + saved/live partial progress
  let n=0;
  STATIONS.forEach(st=>{
    if(S.done.includes(st.id)){ n+=st.challenges.length; return; }
    let ci=0;
    if(cur && !cur.practice && !cur.advanced && STATIONS[cur.si] && STATIONS[cur.si].id===st.id) ci=cur.ci;
    else if(S.partial[st.id]) ci=S.partial[st.id];
    n+=ci;
  });
  return n;
}

function copyText(text, btn){
  const flash=(msg)=>{ if(!btn) return; const orig=btn.textContent; btn.textContent=msg; setTimeout(()=>{ btn.textContent=orig; },2200); };
  const fallback=()=>{
    try{
      const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
      flash('✅ הועתק!');
    }catch(e){ flash('🔗 '+text); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(()=>flash('✅ הועתק!')).catch(fallback);
  else fallback();
}
/* ----- Teacher sign-in. The code IS the identity: no email, no password, no recovery. That
   last part is the whole reason the code is shown so insistently when it is created. ----- */
// A saved code the server no longer recognises (an old code, or one typed on another device and
// since replaced) must not look like a network failure: forget it and ask for the code again.
function codeRejected(){
  signOut();
  teacherLoginScreen('', 'הקוד שנשמר במכשיר הזה לא מוכר. הקלידו את הקוד שלכם שוב, או צרו קוד חדש.');
}
function teacherLoginScreen(prefill, notice){
  go(`
    <div class="card center" style="--c:var(--cyan)">
      <div class="badge-pop" style="font-size:56px;color:var(--c-accent)">${icon('shield')}</div>
      <h2 style="margin-top:6px" class="neon">ניהול כיתות</h2>
      <p class="subtitle">הקוד האישי שלך הוא כל מה שצריך — בלי מייל ובלי סיסמה. הוא מחזיק את כל הכיתות שלך, ועובד מכל מכשיר.</p>
      <label for="teacherCodeInput" class="name-label" style="margin-top:18px">הקוד שלך</label>
      <input id="teacherCodeInput" maxlength="4" inputmode="numeric" pattern="[0-9]*" autocomplete="off"
        placeholder="0000" value="${escapeHtml(formatTeacherCode(prefill||''))}"
        class="code-field" />
      <div id="loginErr" class="code-err" role="alert">${notice?escapeHtml(notice):''}</div>
      <button class="btn big" id="enterBtn">כניסה </button>
      <div class="name-label" style="margin-top:22px">אין לך עדיין קוד?</div>
      <button class="btn ghost big" id="newCodeBtn" style="margin-top:8px">צור/י קוד חדש</button>
    </div>
  `);
  const inp=$('#teacherCodeInput'), err=$('#loginErr'), btn=$('#enterBtn');
  inp.focus();
  // Re-group the digits as they are typed, so the field always looks like the code they were given.
  inp.oninput=()=>{ inp.value=formatTeacherCode(inp.value); err.textContent=''; inp.style.borderColor='var(--cyan)'; };
  const fail=(msg)=>{
    err.textContent=msg; inp.style.borderColor='var(--bad)'; inp.focus(); inp.select();
    btn.disabled=false; btn.textContent='כניסה ▶';
  };
  btn.onclick=async()=>{
    const code=digitsOnly(inp.value);
    if(code.length!==4) return fail('הקוד הוא 4 ספרות.');
    sfx.click(); btn.disabled=true; btn.textContent='נכנס…';
    // The only way to tell a real code from a wrong one is to ask the server, so the first
    // class-list fetch doubles as the check. Store it first; clear it again if it is rejected.
    setTeacherCode(code);
    try{ await listMyClasses(); }
    catch(e){
      setTeacherCode('');
      return fail(isBadCodeError(e) ? 'הקוד הזה לא נמצא. כדאי לבדוק ספרה ספרה.'
                                    : 'אין חיבור לשרת כרגע. נסו שוב בעוד רגע.');
    }
    sfx.badge(); teacherHubScreen();
  };
  inp.onkeydown=(e)=>{ if(e.key==='Enter') btn.click(); };
  $('#newCodeBtn').onclick=()=>{ sfx.click(); teacherChooseCodeScreen(); };
}

  btn.onclick=async()=>{

/* ----- My classes: the one management screen. Create a class, send it its link, and its
   results show up right here, in the same list — no separate screen per class to dig into. ----- */

  if(!signedIn()) return teacherLoginScreen();
  go(`

      <div class="hint" style="margin-top:22px">
        הקוד שלך: <b id="myCode" style="direction:ltr;display:inline-block;font-variant-numeric:tabular-nums">${escapeHtml(maskTeacherCode(getTeacherCode()))}</b>

    if(!name){ $('#createErr').textContent='צריך לתת לכיתה שם.'; nameInp.focus(); return; }
    sfx.click(); createBtn.disabled=true; $('#createErr').textContent='';

  // The code is masked by default in case this screen is shown on a projector.
  $('#revealBtn').onclick=()=>{
    sfx.click();
    const el=$('#myCode'), b=$('#revealBtn'), shown=b.textContent==='הסתרה';
    el.textContent = shown ? maskTeacherCode(getTeacherCode()) : formatTeacherCode(getTeacherCode());
    b.textContent = shown ? 'הצגה' : 'הסתרה';
  };

    sfx.click(); signOut(); teacherLoginScreen();
  };
  renderMyClassesList();
}
// One aggregate line per class. Uses the same name-free function as the results page, so this
// list can never show who a child is — only how many played and how the class did.
async function classSummary(code){
  const students=await sbRpc('get_class_students_safe', {p_code:code});
  const n=students.length;
  return { n,
    avg: n ? Math.round(students.reduce((s,x)=>s+x.score,0)/n) : 0,
    finished: students.filter(x=>x.stations_done>=x.total_stations).length };
}
async function renderMyClassesList(){
  const wrap=$('#myClassesWrap'); if(!wrap) return;
  wrap.innerHTML=`<p class="subtitle" style="margin-top:20px">טוען את הכיתות…</p>`;
  let mine;
  try{ mine=await listMyClasses(); }
  catch(e){
    if(isBadCodeError(e)) return codeRejected();
    if($('#myClassesWrap')) wrap.innerHTML=`<p class="subtitle" style="margin-top:20px">לא הצלחנו לטעון את הכיתות (בעיית רשת). הן שמורות — נסו לרענן.</p>`;
    return;
  }
  if(!$('#myClassesWrap')) return;               // navigated away while loading
  if(!mine.length){
    wrap.innerHTML=`<p class="subtitle" style="margin-top:20px">עוד אין כיתות. צרו את הראשונה למעלה 👆</p>`;
    return;
  }
  wrap.innerHTML=`<div class="myclass-list">${mine.map(c=>`
    <div class="myclass-row" data-code="${escapeHtml(c.code)}">
      <div class="myclass-info">
        <div class="myclass-name">${escapeHtml(c.name||'כיתה')}</div>
        <div class="myclass-stats" data-stats="${escapeHtml(c.code)}">${c.students} שיחקו</div>
      </div>
      <div class="myclass-actions">
        <button class="mini-btn" data-link="${escapeHtml(c.code)}"> קישור</button>
        <button class="mini-btn" data-res="${escapeHtml(c.code)}"> תוצאות</button>
        <button class="mini-btn" data-test="${escapeHtml(c.code)}" title="פתיחת המשחק במצב בדיקה לכיתה הזו">בדיקה</button>
        <button class="myclass-del" data-del="${escapeHtml(c.code)}" title="מחיקת הכיתה" aria-label="מחיקת הכיתה ${escapeHtml(c.name||'')}">${icon('trash')}</button>
      </div>
    </div>`).join('')}</div>`;
  mine.forEach(c=>{
    classSummary(c.code).then(sm=>{
      const el=document.querySelector(`[data-stats="${CSS.escape(c.code)}"]`); if(!el) return;
      el.textContent = sm.n ? `${sm.n} שיחקו · ${sm.finished} סיימו הכול · ממוצע ${sm.avg} נק'` : 'עוד אף אחד לא שיחק';
    }).catch(()=>{});
  });
  wrap.querySelectorAll('.myclass-row').forEach(row=>{
    row.onclick=()=>{ sfx.click(); classResultsScreen(row.dataset.code); };
  });
  wrap.querySelectorAll('[data-link]').forEach(b=>{
    b.onclick=(e)=>{ e.stopPropagation(); sfx.click();
      const c=mine.find(x=>x.code===b.dataset.link); copyText(studentLinkFor(c), b); };
  });
  wrap.querySelectorAll('[data-test]').forEach(b=>{
    b.onclick=(e)=>{ e.stopPropagation(); sfx.click();
      const c=mine.find(x=>x.code===b.dataset.test); window.open(studentLinkFor(c)+'&test=1','_blank'); };
  });
  wrap.querySelectorAll('[data-res]').forEach(b=>{
    b.onclick=(e)=>{ e.stopPropagation(); sfx.click(); classResultsScreen(b.dataset.res); };
  });
  wrap.querySelectorAll('[data-del]').forEach(btn=>{
    btn.onclick=async(e)=>{
      e.stopPropagation();
      const c=mine.find(x=>x.code===btn.dataset.del);
      if(!confirm(`למחוק לצמיתות את הכיתה "${c.name}"? כל התוצאות שלה יימחקו ולא ניתן לשחזר.`)) return;
      sfx.click();
      try{ await deleteClassByCode(c.code); }
      catch(err){ alert('לא הצלחנו למחוק כרגע (בעיית רשת). הכיתה נשארה, אפשר לנסות שוב.'); return; }
      renderMyClassesList();
    };
  });
}

/* ----- Class results — the shareable parent-facing page (?results=CODE). Class-wide only, no names. ----- */
async function classResultsScreen(code){
  go(`<div class="card center"><p class="subtitle">טוען תוצאות כיתה…</p></div>`);
  let data;
  try{ data=await loadClassResults(code); }catch(e){ data=null; }
  if(!data){
    go(`<div class="card center">
          <p class="subtitle">קוד לא נמצא או בעיית רשת. נסו שוב.</p>
          ${signedIn()?`<button class="btn ghost big" id="teacherBackBtn" style="margin-top:14px"> לכל הכיתות</button>`:''}
        </div>`);
    if(signedIn()) $('#teacherBackBtn').onclick=()=>{ sfx.click(); teacherHubScreen(); };
    return;
  }
  const {cls, n, avgScore, completedCount, advancedCount, topicStats}=data;
  const ranked=topicStats.filter(t=>t.pct!=null).sort((a,b)=>b.pct-a.pct);
  const noData=topicStats.filter(t=>t.pct==null);
  // A tie at the top and bottom (e.g. every topic at 100%) has no topic worth singling out to strengthen.
  const strongest=ranked.slice(0,1);
  const weakest=(ranked.length>1 && ranked[ranked.length-1].pct<ranked[0].pct)?ranked.slice(-1):[];
  const bar=(t)=>`
    <div class="topic-bar-row">
      <div class="topic-bar-head">
        <span class="topic-bar-icon" style="color:${t.color}">${icon(t.icon)}</span>
        <span class="topic-bar-title">${escapeHtml(t.title)}</span>
        <span class="topic-bar-pct">${t.pct}%</span>
      </div>
      <div class="topic-bar-track"><div class="topic-bar-fill" style="width:${t.pct}%;background:${t.color}"></div></div>
    </div>`;
  // Turn the weakest topic into something the teacher can act on tomorrow morning.
  const teachTip=(t)=>{
    const st=STATIONS.find(x=>x.id===t.id);
    return (st && st.teachTip) ? `<div class="teach-tip"><b>מומלץ לשיעור הבא:</b> ${escapeHtml(st.teachTip)}</div>` : '';
  };
  const noDataRow=noData.length? `<p class="subtitle" style="margin-top:10px">עוד אין מספיק נתונים על: ${noData.map(t=>escapeHtml(t.title)).join(', ')}.</p>` : '';
  go(`
    <div class="card">
      <div class="chip" style="--c:var(--yellow)">📊 ${escapeHtml(cls.name||'כיתה')} · ${escapeHtml(cls.code)}</div>
      <h2 style="margin-top:10px" class="neon">תמונת מצב — סוכני הסייבר 🛡️</h2>
      <p class="subtitle" style="text-align:start">סיכום מצרפי של כל משתתפי הכיתה במשחק. אין כאן שמות או ציונים אישיים — רק איך הכיתה מתפקדת כקבוצה.</p>
      <div class="stat-row" style="margin-top:10px">
        <div class="stat"><b>${n}</b><span>משתתפים</span></div>
        <div class="stat"><b>${completedCount}</b><span>סיימו הכול</span></div>
        <div class="stat"><b>${avgScore}</b><span>ניקוד ממוצע</span></div>
      </div>
      ${n>0?`<div class="stat-row" style="margin-top:10px">
        <div class="stat" style="min-width:100%"><b style="color:var(--purple)">${advancedCount} 🌟</b><span>עברו את האתגר המתקדם</span></div>
      </div>`:''}
      ${n===0? `<p class="subtitle" style="margin-top:16px">עוד אף אחד לא הצטרף לכיתה הזו.</p>` : `
      ${strongest.length?`<div class="recap-title" style="margin-top:20px">💪 הכי חזק</div>`:''}
      ${strongest.map(bar).join('')}
      ${weakest.length?`<div class="recap-title" style="margin-top:16px">🎯 הכי כדאי לחזק</div>`:''}
      ${weakest.map(bar).join('')}
      ${weakest.map(teachTip).join('')}
      <div class="recap-title" style="margin-top:16px">🗺️ כל הנושאים</div>
      ${ranked.map(bar).join('')}
      ${noDataRow}`}
      <button class="btn big" id="refreshBtn" style="margin-top:18px"> רענן</button>
      ${signedIn()?`<button class="btn ghost big" id="copyResLinkBtn" style="margin-top:10px"> העתק/י קישור לעמוד הזה</button>
      <button class="btn ghost big" id="teacherBackBtn" style="margin-top:10px"> לכל הכיתות</button>`:''}
      <div class="credit">סוכני הסייבר — משחק בטיחות ברשת</div>
    </div>
  `);
  $('#refreshBtn').onclick=()=>{ sfx.click(); classResultsScreen(code); };
  if(signedIn()){
    $('#copyResLinkBtn').onclick=()=>{ sfx.click(); copyText(linkFor('results',cls.code), $('#copyResLinkBtn')); };
    $('#teacherBackBtn').onclick=()=>{ sfx.click(); teacherHubScreen(); };
  }
}

/* ----- Map ----- */
function firstIncomplete(){ for(let i=0;i<STATIONS.length;i++){ if(!S.done.includes(STATIONS[i].id)) return i; } return -1; }
function mapScreen(){
  cur=null; updateHUD();
  const nextIdx=firstIncomplete();
  let nodes='';
  STATIONS.forEach((st,i)=>{
    const done=S.done.includes(st.id);
    const playable = !done && i===nextIdx;      // sequential unlock
    const locked = !done && !playable;
    const n=st.challenges.length;
    const partial = (!done && S.partial[st.id]) ? S.partial[st.id] : 0;
    let right, sub;
    if(done){ right=`<div class="st-badge" aria-label="הושלם">${icon('check')}</div>`; sub='הושלם · '+st.badgeName+' · הקש/י לתרגול'; }
    else if(playable){
      right=`<div class="st-play">${partial?('המשך <span class="num">'+partial+'/'+n+'</span>'):'שחק'}</div>`;
      sub = partial ? ('בתהליך · <span class="num">'+partial+'/'+n+'</span> הושלמו') : 'התחנה הבאה שלך';
    } else { right=`<div class="st-lock">${icon('lock')}</div>`; sub='ננעל — סיים/י את הקודמת'; }
    const clickable = done || playable;
    nodes += `
      <div class="station ${done?'done':''} ${playable?'playable next':''} ${locked?'locked':''} ${clickable?'clickable':''}"
           style="--c:${st.color}" data-i="${i}">
        <div class="st-emoji">${icon(st.icon)}</div>
        <div class="st-body">
          <h3>${st.title}</h3>
          <p>${sub}</p>
        </div>
        ${right}
      </div>`;
    if(i<STATIONS.length-1){                     // trail segment down to the next station — lit up once this one is done
      nodes += `<div class="path-seg"><div class="path-seg-track"><div class="path-seg-line ${done?'filled':''}" style="--c:${st.color}"></div></div></div>`;
    }
  });
  const allDone = S.done.length===STATIONS.length;
  const pendingReview = allDone && S.weakTopics && S.weakTopics.length>0 && !S.reviewDone;
  const advOn = S.advRound && S.advRound.ci < S.advRound.ids.length;
  const advLabel = advOn ? `המשך אתגר מתקדם (${S.advRound.ci}/${S.advRound.ids.length})` : (advancedMaxed() ? 'האתגר המתקדם הושלם' : 'אתגר מתקדם — שאלות קשות יותר');
  go(`
    <div class="map-title">
      <div class="chip" style="--c:var(--c-accent)">מפת המשימות</div>
      <h2 style="margin-top:10px">שלום, <span style="color:var(--c-accent)">${escapeHtml(S.name)}</span></h2>
      <p class="subtitle">${allDone?('כל הכבוד, '+escapeHtml(S.name)+'! סיימת את כל התחנות 🎖️'):'עבור/י תחנה־תחנה והפוך/הפכי לסוכן/ת מוסמך/ת'}</p>
    </div>
    <div class="map">${nodes}</div>
    ${returnDue()?`<button class="btn adv-btn big" id="returnRoundBtn" style="margin-top:14px"> משימת חוזר — ${returnRoundSize()} שאלות קצרות</button>`:''}
    ${allDone? `<button class="btn big" id="certBtn">${pendingReview?'סבב חיזוק קצר לפני התעודה':'לתעודת הסוכן/ת'}</button>
    <button class="btn adv-btn big" id="advBtn" style="margin-top:10px">${advLabel}</button>
    ${advOn?`<button class="btn ghost" id="advNewBtn" style="margin-top:8px"> התחל סבב חדש במקום זה</button>`:''}`:''}
    <div class="save-note">💾 ההתקדמות שלך נשמרת אוטומטית במכשיר הזה</div>
    <div class="map-footer"><button class="link-btn destructive" id="resetAllBtn">אפס את כל המשחק</button></div>
  `);
  document.querySelectorAll('.station.clickable').forEach(el=>{
    el.onclick=()=>{ sfx.click(); startStation(+el.dataset.i); };
  });
  const rrb=$('#returnRoundBtn'); if(rrb) rrb.onclick=()=>{ sfx.click(); returnIntroScreen(); };
  const cb=$('#certBtn'); if(cb) cb.onclick=()=>{ sfx.click(); goToCertOrReview(); };
  const ab=$('#advBtn'); if(ab) ab.onclick=()=>{ sfx.click(); openAdvanced(); };
  const anb=$('#advNewBtn'); if(anb) anb.onclick=()=>{ if(confirm('להתחיל סבב אתגר מתקדם חדש? הסבב הנוכחי בתהליך יימחק.')){ sfx.click(); startAdvanced(); } };
  $('#resetAllBtn').onclick=()=>{
    if(confirm('לאפס את כל המשחק ולהתחיל מההתחלה? כל ההתקדמות תימחק.')){
      sfx.click(); resetProgress(); updateHUD(); startScreen();
    }
  };
}

/* ----- Station flow ----- */
let advStation=null;          // holds the virtual "advanced challenge" station object while active
let advRoundStartScore=0;     // score snapshot at the start of an advanced round (to show round bonus)
let practiceStation=null;     // holds a shuffled-pool variant of a station while replaying it for practice
let reviewStation=null;       // holds the virtual "weak-topic review round" station object while active
function curStation(){
  if(cur && cur.advanced) return advStation;
  if(cur && (cur.review || cur.returnRound)) return reviewStation;
  if(cur && cur.practice && practiceStation) return practiceStation;
  return cur ? STATIONS[cur.si] : null;
}
/* ----- Adaptive world length -----
   A world proves itself in its first two questions. A child who clears both without a mistake
   has shown they know the topic, and asking three more of the same is just time taken from
   them. The moment they slip, the world opens to its full length — those extra questions were
   written for exactly this child. Nothing is dropped: whatever gets skipped seeds the return
   visit, so it comes back later, spaced, when it is worth more. */
const CORE_CHALLENGES = 2;
function worldLength(st){
  if(!cur || cur.practice || cur.review || cur.advanced || cur.returnRound) return st.challenges.length;
  return cur.expanded ? st.challenges.length : Math.min(CORE_CHALLENGES, st.challenges.length);
}
// A wrong answer does two things beyond costing a life: it opens the rest of the world, and it
// records which question was missed, so the return visit can come back to that exact one.
function noteMistake(st){
  if(!cur) return;
  cur.expanded=true;
  if(cur.practice || cur.review || cur.advanced || cur.returnRound) return;
  const list = S.missed[st.id] || (S.missed[st.id]=[]);
  if(!list.includes(cur.ci)) list.push(cur.ci);
  save();
}
function buildPracticeStation(st){
  // mix the original questions with the extra pool and take a fresh random subset each replay
  const pool=shuffle([...st.challenges, ...(st.extra||[])]);
  return {...st, challenges:pool.slice(0, st.challenges.length)};
}

function startStation(si){
  const st=STATIONS[si];
  const practice = S.done.includes(st.id);                 // replaying a finished station = practice (no score change)
  practiceStation = practice ? buildPracticeStation(st) : null;
  let resume = (!practice && S.partial[st.id]) ? S.partial[st.id] : 0;
  if(resume>=st.challenges.length) resume=0;
  // Someone resuming past the core, or with a miss on record, has already earned the full world.
  const missedHere = S.missed[st.id] || [];
  cur={si, ci:resume, lives:LIVES, firstTry:true, practice, hadMistake:false,
       expanded: resume>=CORE_CHALLENGES || missedHere.length>0};
  renderChallenge();
}

function pickAdvancedRound(){
  // one question per topic category, so every round mixes ALL topics (never just one)
  const byCat={};
  ADVANCED.forEach(q=>{ (byCat[q.cat]=byCat[q.cat]||[]).push(q); });
  const cats=shuffle(Object.keys(byCat));
  return cats.map(c=>shuffle(byCat[c].slice())[0]);
}
function buildAdvStation(list){
  return { id:'advanced', title:'אתגר מתקדם', icon:'star', color:'var(--purple)',
           badgeName:'מומחה/ית סייבר', challenges:list };
}
function startAdvanced(){
  advStation=buildAdvStation(pickAdvancedRound());
  advRoundStartScore=S.score;
  S.advRound={ids:advStation.challenges.map(c=>c.id), ci:0, lives:LIVES}; save();
  cur={si:'adv', ci:0, lives:LIVES, firstTry:true, practice:false, advanced:true};
  renderChallenge();
}
function resumeAdvanced(){
  if(!S.advRound){ startAdvanced(); return; }
  const list=S.advRound.ids.map(id=>ADVANCED.find(q=>q.id===id)).filter(Boolean);
  if(!list.length || S.advRound.ci>=list.length){ startAdvanced(); return; }
  advStation=buildAdvStation(list);
  advRoundStartScore=S.score;
  cur={si:'adv', ci:S.advRound.ci, lives:S.advRound.lives, firstTry:true, practice:false, advanced:true};
  renderChallenge();
}
const ADVANCED_ROUND_LIMIT = 1;   // after this many completed rounds, the advanced challenge is finished
function advancedMaxed(){ return (S.advancedPlays||0) >= ADVANCED_ROUND_LIMIT; }
function roundsPhrase(n){ return n===1 ? 'סבב אחד' : n+' סבבים'; }
function openAdvanced(){
  if(S.advRound && S.advRound.ci < S.advRound.ids.length) resumeAdvanced();
  else if(advancedMaxed()) advancedFinaleScreen();
  else startAdvanced();
}
function advancedFinaleScreen(){
  go(`<div class="card center" style="--c:var(--purple)">
        <div class="badge-pop">${icon('trophy')}</div>
        <h2 style="margin-top:8px">האתגר המתקדם הושלם!</h2>
        <p class="subtitle">כבר עברת ${roundsPhrase(ADVANCED_ROUND_LIMIT)} של האתגר המתקדם, ${escapeHtml(S.name)} — זו הרמה הגבוהה ביותר במשחק הזה. את/ה יודע/ת לזהות הונאות, לשמור על פרטיות ולחשוב לפני שלוחצים. תמשיכ/י ליישם את זה גם בחיים האמיתיים — זה מה שבאמת חשוב. 🏆💙</p>
        <div class="stat-row"><div class="stat"><b>${S.score}</b><span>נקודות סה"כ</span></div></div>
        <button class="btn adv-btn big" id="downloadAdvBtn">הורד/י תעודת אתגר מתקדם</button>
        <button class="btn ghost big" id="backBtn" style="margin-top:10px">חזרה למפה </button>
      </div>`);
  $('#downloadAdvBtn').onclick=()=>{ sfx.click(); downloadAdvancedCertificate(); };
  $('#backBtn').onclick=()=>{ sfx.click(); mapScreen(); };
}
function downloadAdvancedCertificate(){
  downloadCertificateImage({
    title:'תעודת אתגר מתקדם', name:S.name,
    subtitle:'עבר/ה את האתגר המתקדם בכל ששת התחומים — מומחה/ית סייבר',
    statsLabel:'תוצאה', statsValue:`${S.score} נקודות · רמה מתקדמת`,
    dateStr:new Date().toLocaleDateString('he-IL')
  }, `תעודת-אתגר-מתקדם-${S.name}.png`);
}

function renderChallenge(){
  const st=curStation(), ch=st.challenges[cur.ci];
  cur.firstTry=true;
  if(cur.advanced){ if(S.advRound){ S.advRound.ci=cur.ci; S.advRound.lives=cur.lives; save(); } }
  else if(!cur.practice && !cur.review && !cur.returnRound){ S.partial[st.id]=cur.ci; save(); }  // remember where we are (resume support)
  updateHUD();
  // Dots show the world as it currently stands: the short path, or the full one once it opened.
  const dots=st.challenges.slice(0,worldLength(st)).map((_,i)=>`<div class="dot ${i<cur.ci?'on':''} ${i===cur.ci?'cur on':''}" style="--c:${st.color}"></div>`).join('');
  const head=`
    <div class="sticky-head">
      <div class="chal-top">
        <button class="mini-btn" id="toMapBtn"> מפה</button>
        <div class="chip" style="--c:${st.color}">${icon(st.icon)} ${st.title}${cur.practice?' · תרגול':''}${cur.review?' · חיזוק':''}</div>
        <button class="mini-btn" id="resetStageBtn"> אפס שלב</button>
      </div>
      <div class="dots">${dots}</div>
    </div>`;
  if(ch.type==='quiz') renderQuiz(st,ch,head);
  else if(ch.type==='rapid') renderRapid(st,ch,head);
  else if(ch.type==='spot') renderSpot(st,ch,head);
  else if(ch.type==='chat') renderChat(st,ch,head);
  else renderSort(st,ch,head);
  $('#toMapBtn').onclick=()=>{ sfx.click(); mapScreen(); };
  $('#resetStageBtn').onclick=()=>{
    if(!confirm('להתחיל את השלב הזה מחדש מההתחלה?')) return;
    sfx.click();
    if(cur.advanced) startAdvanced();
    else if(cur.review) startReviewRound();
    else if(cur.returnRound) startReturnRound();
    else { S.partial[st.id]=0; save(); startStation(cur.si); }
  };
}

function renderQuiz(st,ch,head){
  const order=shuffle(ch.options.map((_,i)=>i));            // randomize option order every time it's shown
  cur._order=order;
  const opts=order.map((origIdx,pos)=>`<button class="opt" data-i="${pos}" style="--c:${st.color}">${ch.options[origIdx]}</button>`).join('');
  go(`<div class="card" style="--c:${st.color}">
        ${head}
        <div class="scenario">${ch.text}</div>
        <div class="prompt">${ch.prompt||''}</div>
        <div class="options" id="opts">${opts}</div>      </div>`);
  document.querySelectorAll('#opts .opt').forEach(b=>{
    b.onclick=()=>answerQuiz(+b.dataset.i, st, ch, order);
  });
}
function answerQuiz(pos, st, ch, order){
  const btns=document.querySelectorAll('#opts .opt');
  if(btns[0] && btns[0].disabled) return;      // already resolving this question — ignore a stray extra tap
  btns.forEach(b=>b.disabled=true);            // lock immediately so a rapid double-tap can't mark a second option
  const correctPos = order.indexOf(ch.answer);
  const correct = pos===correctPos;
  if(correct){
    btns.forEach((b,bi)=>{ if(bi===pos)b.classList.add('correct'); else b.classList.add('dim'); });
    sfx.correct(); haptic.correct();
    awardCorrect(st,ch);
  } else {
    const b=btns[pos]; b.classList.add('wrong');
    cur.lives--; cur.firstTry=false; cur.hadMistake=true; noteMistake(st); streak=0; sfx.wrong(); haptic.wrong(); updateHUD();
    showFeedback(false, ch.explain, ()=>{
      b.classList.remove('wrong');
      if(cur.lives<=0){ stationFailed(st); }
      else btns.forEach(bt=>bt.disabled=false);  // unlock for the retry (same shuffled order)
    });
  }
}

/* ----- Sort mini-game (tap to place — works with touch & mouse) ----- */
/* ----- Rolling conversation -----
   A single question can only ask what is right in the abstract. The situations that actually
   hurt children unfold over several messages, where each answer decides what arrives next —
   which is why a wrong choice here does not simply say "wrong": it plays out, and the child
   reads what the other side does with what they just gave away. Then the turn is offered again,
   with that consequence already seen. */
function renderChat(st,ch,head){
  let turn=0, locked=false;
  cur._chatTurn=()=>turn;
  const log=[];
  go(`<div class="card" style="--c:${st.color}">
        ${head}
        <div class="scenario">${ch.text}</div>
        <div class="chat-window" id="chatWin"></div>
        <div class="chat-opts" id="chatOpts"></div>
      </div>`);
  const win=$('#chatWin'), opts=$('#chatOpts');
  const paint=()=>{
    win.innerHTML=log.map(m=>`<div class="chat-msg ${m.side}">${m.t}</div>`).join('');
    win.scrollTop=win.scrollHeight;
    opts.innerHTML=locked ? '' :
      ch.turns[turn].options.map((o,i)=>`<button class="btn ghost chat-opt" data-i="${i}">${o.t}</button>`).join('');
    opts.querySelectorAll('.chat-opt').forEach(b=> b.onclick=()=>choose(+b.dataset.i));
  };
  const enterTurn=()=>{ log.push({side:'them', t:ch.turns[turn].msg}); paint(); };
  const choose=(i)=>{
    if(locked) return;
    const o=ch.turns[turn].options[i];
    locked=true;
    log.push({side:'me', t:o.t});
    if(o.reply) log.push({side:'them', t:o.reply});
    paint();
    if(o.good){
      sfx.click();
      setTimeout(()=>{
        turn++;
        if(turn>=ch.turns.length){ awardCorrect(st,ch); return; }
        locked=false;
        enterTurn();
      }, 750);
      return;
    }
    cur.lives--; cur.firstTry=false; cur.hadMistake=true; noteMistake(st); streak=0;
    sfx.wrong(); haptic.wrong(); updateHUD();
    showFeedback(false, o.why||ch.explain, ()=>{
      if(cur.lives<=0){ stationFailed(st); return; }
      // Roll the exchange back and offer the same turn again — the consequence has been seen.
      if(o.reply) log.pop();
      log.pop();
      locked=false; paint();
    });
  };
  enterTurn();
}

/* ----- Spot the problem -----
   Every other challenge here hands the child a list and asks which item is right. Real life
   never does that: nothing is labelled, no one announces that a decision is due, and the whole
   skill is noticing that something is off at all. So this one shows an ordinary-looking message
   with nothing marked, and asks them to find what is wrong in it.
   Built from HTML and CSS rather than images, like everything else in this project — which also
   means the suspicious URL is real, readable text rather than a picture of one. */
function renderSpot(st,ch,head){
  const badCount=ch.parts.filter(p=>p.bad).length;
  let found=0, locked=false;
  go(`<div class="card" style="--c:${st.color}">
        ${head}
        <div class="scenario">${ch.text}</div>
        <div class="spot-hint">יש כאן <b>${badCount}</b> ${badCount===1?'דבר חשוד':'דברים חשודים'} — הקישו עליהם 👇</div>
        <div class="spot-frame">
          ${ch.frame&&ch.frame.from?`<div class="spot-from">${ch.frame.from}</div>`:''}
          <div class="spot-body">
            ${ch.parts.map((pt,i)=>`<span class="spot-part${pt.ltr?' ltr':''}" data-i="${i}" role="button" tabindex="0">${pt.t}</span>`).join('')}
          </div>
        </div>
        <div class="spot-progress" id="spotProg">נמצאו 0 מתוך ${badCount}</div>
        <div class="spot-notes" id="spotNotes"></div>
      </div>`);
  const prog=$('#spotProg'), notes=$('#spotNotes');
  const tap=(el)=>{
    if(locked || el.classList.contains('hit')) return;
    const pt=ch.parts[+el.dataset.i];
    if(pt.bad){
      el.classList.add('hit');
      found++;
      sfx.click();
      prog.textContent=`נמצאו ${found} מתוך ${badCount}`;
      notes.insertAdjacentHTML('beforeend', `<div class="spot-note">✅ ${pt.why||''}</div>`);
      if(found>=badCount){ locked=true; awardCorrect(st,ch); }
      return;
    }
    // A wrong tap is still a teaching moment: say why that part is in fact fine.
    locked=true;
    el.classList.add('miss');
    setTimeout(()=>el.classList.remove('miss'), 600);
    cur.lives--; cur.firstTry=false; cur.hadMistake=true; noteMistake(st); streak=0;
    sfx.wrong(); haptic.wrong(); updateHUD();
    showFeedback(false, pt.why||'החלק הזה בסדר. חפש/י מה שלוחץ עלייך למהר, מבקש משהו מוזר, או פרט שמאפשר למצוא אותך.',
      ()=>{ locked=false; if(cur.lives<=0) stationFailed(st); });
  };
  document.querySelectorAll('.spot-part').forEach(el=>{
    el.onclick=()=>tap(el);
    el.onkeydown=(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); tap(el); } };
  });
}

/* ----- Rapid round -----
   A handful of one-tap calls after a run of scenario questions. Its job is pace rather than
   new material: same topic, a completely different motion, which is what pulls a child's
   attention back before it drifts. The whole round counts as one challenge — a wrong tap costs
   a life and explains itself, exactly like a wrong answer anywhere else, and the round carries
   on rather than restarting. */
function renderRapid(st,ch,head){
  const cards=shuffle(ch.cards.slice());
  cur._rapidCard=()=>cards[i];
  // Taps keep landing while the feedback modal is up and after the last card is answered —
  // a double-tap on the final card is enough. Both are ignored rather than read past the end.
  let i=0, locked=false;
  go(`<div class="card" style="--c:${st.color}">
        ${head}
        <div class="scenario">${ch.text}</div>
        <div id="rapidStage"></div>
        <div class="rapid-btns">
          <button class="btn rapid-btn ok" id="rOk"> ${ch.okLabel||'בסדר'}</button>
          <button class="btn rapid-btn bad" id="rBad"> ${ch.badLabel||'לא בסדר'}</button>
        </div>
      </div>`);
  const stage=$('#rapidStage');
  const paint=()=>{
    stage.innerHTML=`<div class="rapid-count">${i+1} / ${cards.length}</div>
                     <div class="rapid-card">${cards[i].t}</div>`;
  };
  const advance=()=>{ i++; if(i>=cards.length) awardCorrect(st,ch); else paint(); };
  const answer=(said)=>{
    if(locked || i>=cards.length) return;
    const card=cards[i];
    if(said===card.ok){ sfx.click(); advance(); return; }
    locked=true;
    cur.lives--; cur.firstTry=false; cur.hadMistake=true; noteMistake(st); streak=0;
    sfx.wrong(); haptic.wrong(); updateHUD();
    showFeedback(false, card.why||ch.explain, ()=>{
      locked=false;
      if(cur.lives<=0) stationFailed(st); else advance();
    });
  };
  $('#rOk').onclick=()=>answer(true);
  $('#rBad').onclick=()=>answer(false);
  paint();
}
function renderSort(st,ch,head){
  // shuffle a working copy
  const items=ch.items.map((it,idx)=>({...it,idx,placed:null}));
  shuffle(items);
  cur._sort={items,selected:null};
  go(`<div class="card" style="--c:${st.color}">
        ${head}
        <div class="scenario">${ch.text}</div>
        <div class="sort-instr">גררו פריט לתיבה המתאימה (ואפשר לגרור בחזרה) — או הקישו על פריט ואז על תיבה 👇</div>
        <div class="sort-items" id="pool"></div>
        <div class="bins">
          <div class="bin binL" data-bin="0"><h4>${ch.binL}</h4><div class="drop" id="d0"></div></div>
          <div class="bin binR" data-bin="1"><h4>${ch.binR}</h4><div class="drop" id="d1"></div></div>
        </div>
        <button class="btn big" id="checkBtn" style="margin-top:16px" disabled>בדוק/י </button>      </div>`);
  document.querySelectorAll('.bin').forEach(bin=> bin.onclick=()=>placeSelected(+bin.dataset.bin, st, ch));
  $('#checkBtn').onclick=()=>checkSort(st,ch);
  drawSort(st);
}
function drawSort(st){
  const {items,selected}=cur._sort;
  const pool=$('#pool'); pool.innerHTML='';
  $('#d0').innerHTML=''; $('#d1').innerHTML='';
  items.forEach(it=>{
    const el=document.createElement('button');
    el.className='item'+(selected===it.idx?' selected':'');
    el.style.setProperty('--c',st.color);
    el.textContent=it.t;
    el.addEventListener('pointerdown', e=>onItemPointerDown(e, it.idx, st));
    if(it.placed===null) pool.appendChild(el);
    else $('#d'+it.placed).appendChild(el);
  });
  // arm bins if an item is selected
  document.querySelectorAll('.bin').forEach(b=> b.classList.toggle('armed', selected!==null));
  const allPlaced=items.every(it=>it.placed!==null);
  $('#checkBtn').disabled=!allPlaced;
  updateHUD();
}
function selectItem(idx, st){ cur._sort.selected = (cur._sort.selected===idx?null:idx); sfx.click(); drawSort(st); }
function placeSelected(bin, st){
  const s=cur._sort; if(s.selected===null) return;
  const it=s.items.find(i=>i.idx===s.selected); it.placed=bin; s.selected=null; sfx.click(); drawSort(st);
}

/* ----- drag & drop for sort items (pointer events: mouse + touch + pen) ----- */
const DRAG_THRESHOLD=7;
let dragState=null;
function onItemPointerDown(e, idx, st){
  if(e.button!=null && e.button!==0) return;
  const el=e.currentTarget, rect=el.getBoundingClientRect();
  dragState={ idx, st, startX:e.clientX, startY:e.clientY,
    offX:e.clientX-rect.left, offY:e.clientY-rect.top, w:rect.width,
    dragging:false, ghost:null, sourceEl:el, pointerId:e.pointerId };
  try{ el.setPointerCapture(e.pointerId); }catch(err){}
  el.addEventListener('pointermove', onItemPointerMove);
  el.addEventListener('pointerup', onItemPointerUp);
  el.addEventListener('pointercancel', onItemPointerCancel);
}
function onItemPointerMove(e){
  if(!dragState) return;
  const dx=e.clientX-dragState.startX, dy=e.clientY-dragState.startY;
  if(!dragState.dragging && Math.hypot(dx,dy)>DRAG_THRESHOLD){
    dragState.dragging=true;
    dragState.sourceEl.classList.add('dragging-source');
    const g=dragState.sourceEl.cloneNode(true);
    g.className='item drag-ghost'; g.style.width=dragState.w+'px';
    document.body.appendChild(g); dragState.ghost=g;
  }
  if(dragState.dragging){
    dragState.ghost.style.left=(e.clientX-dragState.offX)+'px';
    dragState.ghost.style.top=(e.clientY-dragState.offY)+'px';
    document.querySelectorAll('.bin,.sort-items').forEach(z=>z.classList.remove('drag-over'));
    const under=document.elementFromPoint(e.clientX,e.clientY);
    const target=under && (under.closest('.bin')||under.closest('.sort-items'));
    if(target) target.classList.add('drag-over');
  }
}
function cleanupDrag(){
  const ds=dragState; if(!ds) return;
  ds.sourceEl.removeEventListener('pointermove', onItemPointerMove);
  ds.sourceEl.removeEventListener('pointerup', onItemPointerUp);
  ds.sourceEl.removeEventListener('pointercancel', onItemPointerCancel);
  try{ ds.sourceEl.releasePointerCapture(ds.pointerId); }catch(err){}
  document.querySelectorAll('.bin,.sort-items').forEach(z=>z.classList.remove('drag-over'));
  if(ds.ghost) ds.ghost.remove();
  ds.sourceEl.classList.remove('dragging-source');
}
function onItemPointerUp(e){
  if(!dragState) return;
  const ds=dragState, wasDragging=ds.dragging;
  cleanupDrag();
  if(wasDragging){
    const under=document.elementFromPoint(e.clientX,e.clientY);
    const bin=under && under.closest('.bin');
    const pool=under && under.closest('.sort-items');
    const it=cur._sort.items.find(i=>i.idx===ds.idx);
    if(bin){ it.placed=+bin.dataset.bin; sfx.click(); }
    else if(pool){ it.placed=null; sfx.click(); }
    cur._sort.selected=null;
    dragState=null;
    drawSort(ds.st);
  } else {
    dragState=null;
    selectItem(ds.idx, ds.st);
  }
}
function onItemPointerCancel(){ cleanupDrag(); dragState=null; }
function checkSort(st,ch){
  if($('#checkBtn').disabled) return;         // already resolving this question — ignore a stray extra tap
  $('#checkBtn').disabled=true;
  const items=cur._sort.items;
  const wrong = items.filter(it=>it.placed!==it.bin).length;
  if(wrong===0){
    sfx.correct(); haptic.correct();
    awardCorrect(st,ch);
  } else {
    cur.lives--; cur.firstTry=false; cur.hadMistake=true; noteMistake(st); streak=0; sfx.wrong(); haptic.wrong(); updateHUD();
    // No per-item reveal — teach the principle and let them rethink (their arrangement stays).
    const hint = ch.explain + ` <b>(עדיין ${wrong} לא במקום הנכון — חשוב/י איזה צד מתאים לכל פריט.)</b>`;
    showFeedback(false, hint, ()=>{ if(cur.lives<=0){ stationFailed(st); } else $('#checkBtn').disabled=false; });
  }
}

function shortRecap(text){
  const m=text.match(/^[^.!?—]+[.!?]?/);
  let s=(m?m[0]:text).trim();
  if(s.length>78) s=s.slice(0,75)+'…';
  return s;
}
let streak=0;                  // consecutive first-try-correct answers this session (not persisted)
const STREAK_MILESTONE=3, STREAK_BONUS=5;
function awardCorrect(st,ch){
  const pts = cur.practice ? 0 : (cur.advanced ? (cur.firstTry?15:8) : (cur.firstTry?10:5));
  let bonus=0;
  if(cur.firstTry){
    streak++;
    if(!cur.practice && streak%STREAK_MILESTONE===0) bonus=STREAK_BONUS;
  }
  if(!cur.practice){ S.score+=pts+bonus; save(); updateHUD(); }
  const note = cur.firstTry ? shortRecap(ch.explain) : ch.explain;
  showFeedback(true, note, ()=>nextChallenge(st), pts, bonus, streak);
}
function showFeedback(good, text, onNext, pts, bonus, streakCount){

/* ----- Return visit -----
   Everything so far happens in one sitting, and one sitting fades. This brings back exactly the
   material worth revisiting — the questions the child got wrong, and the ones the short path
   never showed them — after enough days have passed for the spacing to do its work. */
const RETURN_AFTER_MS = 2*24*60*60*1000;      // two days away is enough to make recall worth testing
const RETURN_ROUND_LEN = 5;
function returnPool(){
  const out=[];
  STATIONS.forEach(st=>{
    if(!S.done.includes(st.id)) return;
    const missed = S.missed[st.id] || [];
    missed.forEach(i=>{ if(st.challenges[i]) out.push(st.challenges[i]); });
    // whatever the short path never put in front of them
    const seen = missed.length ? st.challenges.length : Math.min(CORE_CHALLENGES, st.challenges.length);
    st.challenges.slice(seen).forEach(c=>out.push(c));
    (st.extra||[]).forEach(c=>out.push(c));
  });
  return out;
}
function returnDue(){
  if(returnRoundDoneNow || S.done.length===0) return false;
  if(sessionGapMs < RETURN_AFTER_MS) return false;
  if(S.returnDoneAt && (Date.now()-S.returnDoneAt) < RETURN_AFTER_MS) return false;
  return returnPool().length>0;
}
// The number promised on screen is the number actually available, which near the end of the
// content can be fewer than the round's ceiling.
function returnRoundSize(){ return Math.min(RETURN_ROUND_LEN, returnPool().length); }
function returnIntroScreen(){
  const days=Math.max(2, Math.floor(sessionGapMs/(24*60*60*1000)));
  const count=returnRoundSize();
  go(`<div class="card center" style="--c:var(--purple)">

        <p class="subtitle">עברו ${days} ימים מאז ששיחקת. ${count} שאלות קצרות כדי לבדוק מה נשאר —
        חלקן דברים שפספסת, וחלקן שאלות שעוד לא ראית.</p>
        <button class="btn big" id="returnBtn" style="margin-top:16px">יאללה, בואו נבדוק </button>
        <button class="btn ghost big" id="skipReturnBtn" style="margin-top:10px">אולי אחר כך</button>
      </div>`);
  $('#returnBtn').onclick=()=>{ sfx.click(); startReturnRound(); };
  $('#skipReturnBtn').onclick=()=>{ sfx.click(); returnRoundDoneNow=true; mapScreen(); };
}
function startReturnRound(){

/* ----- Certificate ----- */
/* ---------- certificate image (A4 landscape PNG, "module row" design) ----------
   A printable certification: issuer line, the name, then one medallion per world the way a
   certification lists the modules it covers, and an issue date / score / certificate number
   footer. Drawn on canvas so it downloads as a real image file on every device. */
const CERT_W=1754, CERT_H=1240;                 // A4 landscape at 150 dpi
const CERT_LABELS=['סיסמאות','זרים','פרטיות','בריונות','פישינג','רשתות'];
// Same number every time for the same device — not a secret and not a lookup key, just the
// kind of reference a certification carries.
function certNumber(){
  const src=String(S.deviceId||S.name||'agent'); let h=5381;
  for(let i=0;i<src.length;i++) h=((h*33)^src.charCodeAt(i))>>>0;
  const code=h.toString(36).toUpperCase().padStart(4,'0').slice(-4);
  return `CSA-${String(new Date().getFullYear()).slice(-2)}-${code}`;
}
function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function rgbOf(c){
  c=(c||'').trim();
  if(c.startsWith('#')){ if(c.length===4) c='#'+[...c.slice(1)].map(x=>x+x).join(''); const n=parseInt(c.slice(1,7),16); return [n>>16&255,n>>8&255,n&255]; }
  const m=c.match(/\d+(\.\d+)?/g); return m ? m.slice(0,3).map(Number) : [110,110,115];
}
function loadImg(src){ return new Promise(res=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src=src; }); }
// The game's own SVG icons, rasterised in a given colour. The one icon drawn for a dark
// background (a cut-out circle) gets the medallion's tint instead, so it reads on white.
function iconImage(key, color, bg){
  const fill=!!ICON_FILL_PATHS[key];
  const d=(fill?ICON_FILL_PATHS[key]:ICON_PATHS[key]||'').replace(/#0a1128/g,bg);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="120" height="120" color="${color}" fill="${fill?color:'none'}" stroke="${fill?'none':color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  return loadImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg));
}
async function renderCertificateCanvas(o){
  try{ await Promise.all([document.fonts.load('800 60px Assistant'),document.fonts.load('700 30px Assistant'),document.fonts.load('400 30px Assistant')]); }catch(e){}
  const W=CERT_W, H=CERT_H, cx=W/2;
  const cvs=document.createElement('canvas'); cvs.width=W; cvs.height=H;
  const ctx=cvs.getContext('2d');
  const F="Assistant, 'Segoe UI', Arial, sans-serif";
  const INK='#1d1d1f', MUTED='#6e6e73', LINE='#d2d2d7', ACCENT='#0f8f85';
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=LINE; ctx.lineWidth=2; roundRectPath(ctx,56,56,W-112,H-112,28); ctx.stroke();
  ctx.direction='rtl'; ctx.textAlign='center';

  const logo=await loadImg('/icons/icon-192.png');
  if(logo){ ctx.save(); roundRectPath(ctx,cx-52,124,104,104,24); ctx.clip(); ctx.drawImage(logo,cx-52,124,104,104); ctx.restore(); }
  ctx.fillStyle=ACCENT; ctx.font=`700 32px ${F}`; ctx.fillText(`${o.title} · סוכני הסייבר`, cx, 292);
  ctx.fillStyle=INK;    ctx.font=`800 118px ${F}`; ctx.fillText(o.name, cx, 430, W-320);
  ctx.fillStyle=MUTED;  ctx.font=`400 40px ${F}`; ctx.fillText(o.subtitle, cx, 500, W-320);

  // one medallion per world, first world on the right (reading order)
  const n=STATIONS.length, d=156, gap=58, total=n*d+(n-1)*gap, y=680;
  let x=cx+total/2-d/2;
  for(let i=0;i<n;i++){
    const [r,g,b]=rgbOf(cssColor(STATIONS[i].color));
    const deep=`rgb(${Math.round(r*.6)},${Math.round(g*.6)},${Math.round(b*.6)})`;
    const tint=`rgb(${Math.round(255-(255-r)*.18)},${Math.round(255-(255-g)*.18)},${Math.round(255-(255-b)*.18)})`;
    ctx.fillStyle=tint; ctx.beginPath(); ctx.arc(x,y,d/2,0,Math.PI*2); ctx.fill();
    const im=await iconImage(STATIONS[i].icon, deep, tint);
    if(im) ctx.drawImage(im, x-42, y-42, 84, 84);
    ctx.fillStyle=INK; ctx.font=`700 30px ${F}`; ctx.fillText(CERT_LABELS[i]||STATIONS[i].title, x, y+d/2+54);
    x-=d+gap;
  }

  // footer: issue date (right) · results (centre) · certificate number (left)
  const fy=980;
  ctx.strokeStyle=LINE; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(170,fy-70); ctx.lineTo(W-170,fy-70); ctx.stroke();
  const col=(label, value, xPos, ltr)=>{
    ctx.fillStyle=MUTED; ctx.font=`400 26px ${F}`; ctx.fillText(label, xPos, fy);
    ctx.fillStyle=INK; ctx.font=`700 38px ${ltr?"ui-monospace, Menlo, Consolas, monospace":F}`;
    if(ltr){ ctx.direction='ltr'; ctx.fillText(value, xPos, fy+50); ctx.direction='rtl'; }
    else ctx.fillText(value, xPos, fy+50);
  };
  col('תאריך הנפקה', o.dateStr, W-420);
  col(o.statsLabel, o.statsValue, cx);
  col('מספר תעודה', certNumber(), 420, true);

  ctx.fillStyle=MUTED; ctx.font=`400 24px ${F}`;
  ctx.fillText('סוכני הסייבר — משחק בטיחות ברשת · נוצר ע"י אלון ואורי מרקוביץ', cx, H-100);
  return cvs;
}
async function downloadCertificateImage(o, filename){
  const cvs=await renderCertificateCanvas(o);
  cvs.toBlob(blob=>{
    if(!blob) return;
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }, 'image/png');
}
