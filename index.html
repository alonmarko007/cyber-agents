/* ---------- confetti ---------- */
const cv=$('#confetti'), cx=cv.getContext('2d'); let parts=[];
function sz(){ cv.width=innerWidth; cv.height=innerHeight; } sz(); addEventListener('resize',sz);
function cssColor(v){ if(v&&v.startsWith('var(')){ return getComputedStyle(document.documentElement).getPropertyValue(v.slice(4,-1)).trim()||'#fff'; } return v||'#fff'; }
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
function burst(color){
  if(reduceMotion) return;
  const col=cssColor(color); const cols=[col,'#ffd54f','#00e5ff','#b388ff','#ff5c8a','#00e676'];
  for(let i=0;i<140;i++) parts.push({
    x:innerWidth/2+(Math.random()-.5)*120, y:innerHeight*0.35,
    vx:(Math.random()-.5)*9, vy:Math.random()*-11-3,
    g:.3+Math.random()*.2, s:5+Math.random()*7, r:Math.random()*6,
    vr:(Math.random()-.5)*.4, c:cols[i%cols.length], life:90+Math.random()*40
  });
  if(!raf) tick();
}
let raf=null;
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life--;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.globalAlpha=Math.max(0,p.life/40);
    cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); cx.restore(); });
  parts=parts.filter(p=>p.life>0 && p.y<cv.height+40);
  if(parts.length) raf=requestAnimationFrame(tick); else { raf=null; cx.clearRect(0,0,cv.width,cv.height); }
}

/* ---------- utils ---------- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- crash safety net: never leave the screen stuck/dead ---------- */
window.addEventListener('error', ()=>{
  if(document.querySelector('.fb-overlay')) return; // don't fight an open feedback modal
  try{ mapScreen(); }catch(e){ try{ startScreen(); }catch(e2){} }
});

/* ---------- test mode (?class=CODE&test=1, owner's device only) ----------
   A quick way to run a whole class through the game and check that progress and results come
   out right, without answering 36 questions by hand. It plays the real game — the same screens,
   scoring and sync — so what lands in the class results is exactly what a real player produces.
   It keeps its own save, so it never touches a game played normally on the same device. */
const tsleep=ms=>new Promise(r=>setTimeout(r,ms));
let testBusy=false;
// Answers the challenge on screen. A correct answer also clicks through its feedback, so one tap
// moves to the next question; a wrong one leaves the explanation up so it can be read.
async function testAnswer(correct){
  const fbb=$('#fbBtn'); if(fbb){ fbb.click(); await tsleep(120); if(!correct) return; }
  // Between challenges (a badge, the out-of-lives screen, onboarding) the same tap just moves on.
  if(!$('#toMapBtn')){
    const next=$('#retryBtn')||$('#contBtn')||$('#onboardBtn')||$('#reviewBtn');
    if(correct && next){ next.click(); await tsleep(150); }
    return;
  }
  if(!cur) return;
  const st=curStation(), ch=st.challenges[cur.ci]; if(!ch) return;
  if(ch.type==='quiz'){
    const btns=[...document.querySelectorAll('#opts .opt')]; if(!btns.length || btns[0].disabled) return;
    const right=cur._order.indexOf(ch.answer);
    const pos = correct ? right : btns.findIndex((_,i)=>i!==right);
    btns[pos].click();
  } else if(ch.type==='sort'){
    const s=cur._sort;
    s.items.forEach((it,k)=>{ it.placed = correct ? it.bin : (k===0 ? 1-it.bin : it.bin); });
    s.selected=null; drawSort(st); $('#checkBtn').click();
  } else if(ch.type==='spot'){
    const parts=[...document.querySelectorAll('.spot-part')];
    if(!correct){ const ok=parts.find(p=>!ch.parts[+p.dataset.i].bad); if(ok) ok.click(); }
    else for(const p of parts){ if(ch.parts[+p.dataset.i].bad && !p.classList.contains('hit')){ p.click(); await tsleep(40); } }
  } else if(ch.type==='rapid'){
    if(!correct){ const c=cur._rapidCard(); if(c) $(c.ok?'#rBad':'#rOk').click(); }
    else { for(let n=0;n<ch.cards.length;n++){ const c=cur._rapidCard(); if(!c) break; $(c.ok?'#rOk':'#rBad').click(); await tsleep(40); } }
  } else if(ch.type==='chat'){
    for(let t=0;t<ch.turns.length;t++){
      const turn=cur._chatTurn(); const opts=[...document.querySelectorAll('.chat-opt')]; if(!opts.length) break;
      const pick=opts.find(b=>!!ch.turns[turn].options[+b.dataset.i].good===correct);
      if(!pick) break;
      pick.click();
      if(!correct) return;
      await tsleep(900);
      if(!cur || $('#fbBtn')) break;
    }
  }
  if(correct){ for(let k=0;k<20;k++){ const b=$('#fbBtn'); if(b){ b.click(); await tsleep(120); break; } await tsleep(50); } }
}
// Plays the current world to its end with correct answers.
function testEnsurePlayer(){
  if(!S.name || S.name==='סוכן/ת'){ S.name='בודק/ת '+Math.floor(100+Math.random()*900); }
  S.onboarded=true; save();
}
async function testFinishWorld(){
  testEnsurePlayer();
  if(!cur){ const i=firstIncomplete(); if(i<0) return; startStation(i); await tsleep(150); }
  const sid=curStation() && curStation().id;
  for(let g=0; g<40 && cur && curStation() && curStation().id===sid; g++) await testAnswer(true);
}
async function testFinishAll(){
  testEnsurePlayer();
  for(let g=0; g<STATIONS.length+1; g++){
    // Carry on with the world already open, so its mistakes still count toward weak topics.
    if(!(cur && $('#toMapBtn'))){ const i=firstIncomplete(); if(i<0) break; startStation(i); await tsleep(150); }
    await testFinishWorld();
  }
  mapScreen();
}
function testNewPlayer(){
  if(!confirm('להתחיל שחקן/ית בדיקה חדש/ה? הוא/היא ייספר/תיספר בכיתה כמשתתף/ת נוסף/ת.')) return;
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  location.reload();
}
function mountTestBar(){
  document.body.classList.add('test-mode');
  const bar=document.createElement('div'); bar.className='test-bar';
  bar.innerHTML=`
    <span class="test-tag">🧪 בדיקה</span>
    <button data-t="ok">✅ ענה נכון</button>
    <button data-t="bad">❌ טעות</button>
    <button data-t="world">⏭️ סיים עולם</button>
    <button data-t="all">🏁 סיים הכול</button>
    <button data-t="new">👤 שחקן חדש</button>`;
  document.body.appendChild(bar);
  const run=async(fn)=>{ if(testBusy) return; testBusy=true; bar.classList.add('busy'); try{ await fn(); }catch(e){ console.error(e); } finally{ testBusy=false; bar.classList.remove('busy'); } };
  bar.querySelector('[data-t=ok]').onclick=()=>run(()=>testAnswer(true));
  bar.querySelector('[data-t=bad]').onclick=()=>run(()=>testAnswer(false));
  bar.querySelector('[data-t=world]').onclick=()=>run(testFinishWorld);
  bar.querySelector('[data-t=all]').onclick=()=>run(testFinishAll);
  bar.querySelector('[data-t=new]').onclick=testNewPlayer;
}
if(TEST_MODE) mountTestBar();

/* ---------- boot ---------- */
(function boot(){
  const params=new URLSearchParams(location.search);
  const resultsCode=params.get('results'), teacherFlag=params.get('teacher'), classCode=params.get('class'), classNameParam=params.get('cn');
  if(resultsCode) return classResultsScreen(resultsCode);
  if(teacherFlag) return teacherHubScreen();
  // A child who has been away long enough is met with the return visit rather than having to
  // spot a button for it.
  if(S.onboarded && returnDue()) return returnIntroScreen();
  if(classCode){
    // Arriving through a class link already answers "are you playing with a class?" — don't ask again,
    // even if the join fetch is still in flight when the kid hits start.
    S.classAsked=true;
    // Show the class name on the very first paint (from the link's ?cn=), so the invitation
    // visibly ties back to the class the teacher named — no need to wait on the join fetch.
    if(classNameParam){ S.classCode=classCode; S.className=classNameParam; }
    save();
    joinClass(classCode).then(cls=>{
      if(cls){ syncStudentProgress(); refreshLogo(); }
    }).catch(()=>{});
  }
  startScreen();
})();

// Small on-screen build marker (bottom-left, low-opacity) so it's possible to confirm which
// deploy is actually live on a given device without checking Vercel — teacher area only, never
// shown on the kids' game itself. Fails silently offline or wherever /api isn't available.
if(new URLSearchParams(location.search).get('teacher')){
  fetch('/api/version').then(r=>r.json()).then(v=>{
    if(v && v.sha) $('#versionTag').textContent = 'v.'+v.sha+(v.env!=='production'?' ('+v.env+')':'');
  }).catch(()=>{});
}

/* ---------- PWA: register service worker ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}
