<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>סוכני הסייבר — משחק בטיחות ברשת</title>
<meta name="description" content="משחק חינוכי ללימוד בטיחות ברשת לילדים ובני נוער.">
<meta name="theme-color" content="#070b18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<!-- PWA -->
<link rel="manifest" href="/manifest.webmanifest" id="manifestLink">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<!-- iOS home-screen app -->
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" id="appleTouchIcon">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="סוכני הסייבר" id="appleTitle">
<script>
  /* Swap the PWA identity — manifest, title, and (for the teacher) home-screen icon — BEFORE the
     user gets a chance to "Add to Home Screen", so whatever gets saved relaunches into the right
     place instead of always landing on the bare kids' start screen.
     - ?teacher=1 gets its own static manifest (fixed start_url, teacher-branded icon).
     - ?class=CODE gets a manifest generated on the fly by /api/manifest, with THIS class's code
       baked into start_url — otherwise every class link shared a single static manifest.webmanifest
       (start_url "/"), so any class's installed icon reopened to the generic start screen, forgetting
       which class it was ever for. */
  var params = new URLSearchParams(location.search);
  if (params.get('teacher')) {
    document.title = 'סוכני הסייבר — אזור מורה';
    document.getElementById('manifestLink').href = '/manifest-teacher.webmanifest';
    document.getElementById('appleTouchIcon').href = '/icons/teacher-apple-touch-icon.png';
    document.getElementById('appleTitle').content = 'אזור מורה';
  } else if (params.get('class')) {
    var className = params.get('cn') || '';
    document.title = 'סוכני הסייבר' + (className ? ' — ' + className : '');
    document.getElementById('manifestLink').href = '/api/manifest?' + params.toString();
    document.getElementById('appleTitle').content = className || 'סוכני הסייבר';
  }
</script>
<style>
  :root{
    --bg:#070b18;
    --bg2:#0d1430;
    --panel:rgba(18,26,54,.85);
    --panel-solid:#121a36;
    --ink:#eaf2ff;
    --muted:#8fa0c8;
    --cyan:#00e5ff;
    --purple:#b388ff;
    --green:#00e676;
    --pink:#ff5c8a;
    --yellow:#ffd54f;
    --orange:#ff9a3c;
    --good:#00e676;
    --bad:#ff4d6d;
    --line:rgba(120,150,220,.25);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  html{height:-webkit-fill-available}
  body{
    height:100vh;height:100dvh;
    overscroll-behavior:contain;
    font-family:'Assistant','Segoe UI','Arial Hebrew',system-ui,sans-serif;
    background:
      radial-gradient(1000px 600px at 80% -10%, rgba(0,229,255,.10), transparent 60%),
      radial-gradient(900px 600px at 10% 110%, rgba(179,136,255,.12), transparent 60%),
      var(--bg);
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  /* subtle animated grid backdrop */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;
    background-image:linear-gradient(rgba(90,120,200,.08) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(90,120,200,.08) 1px,transparent 1px);
    background-size:44px 44px;
    mask:radial-gradient(circle at 50% 40%,#000,transparent 85%);
  }
  /* app fills the viewport exactly; HUD stays pinned, #screen is the only scrolling region */
  #app{position:relative;z-index:1;max-width:820px;margin:0 auto;
       height:100vh;height:100dvh;
       display:flex;flex-direction:column;overflow:hidden;
       padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right))
               calc(10px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
  #screen{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
          display:flex;flex-direction:column}
  canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

  h1,h2,h3{margin:0}
  .neon{text-shadow:0 0 8px currentColor,0 0 22px currentColor}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit}
  .icon{width:1em;height:1em;flex-shrink:0}

  /* ---------- HUD ---------- */
  #hud{display:none;flex-shrink:0;gap:10px;align-items:center;justify-content:space-between;
       background:var(--panel);border:1px solid var(--line);border-radius:16px;
       padding:10px 12px;backdrop-filter:blur(6px);margin-bottom:10px;flex-wrap:wrap}
  .hud-rank{font-weight:800;font-size:14px;color:var(--cyan)}
  .hud-rank small{display:block;color:var(--muted);font-weight:600;font-size:11px}
  .hearts{font-size:20px;letter-spacing:2px;filter:drop-shadow(0 0 6px rgba(255,77,109,.6))}
  .hud-score{font-weight:900;font-size:20px;color:var(--yellow)}
  .hud-score small{font-size:11px;color:var(--muted);font-weight:700}
  .xpwrap{flex:1 1 140px;min-width:120px}
  .xpbar{height:10px;border-radius:99px;background:#0a1128;border:1px solid var(--line);overflow:hidden}
  .xpfill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--purple));
          box-shadow:0 0 12px var(--cyan);transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .xplabel{font-size:10px;color:var(--muted);margin-top:3px;text-align:center}
  #muteBtn{background:#0a1128;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:16px;
           min-width:44px;min-height:44px;display:grid;place-items:center}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;
        backdrop-filter:blur(6px);flex-shrink:0}
  .center{text-align:center}
  /* short "modal-style" cards (start/certificate/completion) center in the viewport when they
     don't fill it; auto margins collapse to 0 (normal top flow) once content overflows */
  .card.center,.cert{margin-block:auto}

  /* ---------- Start screen ---------- */
  .logo{font-size:clamp(30px,9vw,54px);font-weight:900;line-height:1.05;
        background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));
        -webkit-background-clip:text;background-clip:text;color:transparent;
        filter:drop-shadow(0 0 18px rgba(0,229,255,.35))}
  .subtitle{color:var(--muted);margin-top:8px;font-weight:600}
  .agent-emoji{width:88px;height:88px;border-radius:22px;filter:drop-shadow(0 0 18px rgba(0,229,255,.5));animation:float 3s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-10px)}}
  .name-label{display:block;margin-top:16px;font-size:15px;font-weight:800;color:var(--cyan)}
  input#nameInput{width:100%;margin-top:8px;padding:14px 16px;border-radius:14px;
    background:#0a1128;border:2px solid var(--cyan);color:var(--ink);font-size:17px;text-align:center;font-weight:700;
    box-shadow:0 0 14px -4px var(--cyan)}
  input#nameInput:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,229,255,.25)}
  .btn{display:inline-block;padding:15px 26px;border-radius:16px;font-weight:900;font-size:18px;
       background:linear-gradient(180deg,var(--cyan),#00a7c4);color:#04121a;
       box-shadow:0 8px 0 #026277,0 10px 24px rgba(0,229,255,.35);transition:transform .06s,box-shadow .06s}
  .btn:not(:disabled):active{transform:translateY(5px);box-shadow:0 3px 0 #026277,0 6px 14px rgba(0,229,255,.3)}
  .btn.big{width:100%;margin-top:16px;font-size:20px}
  .btn.ghost{background:#0e1738;color:var(--ink);box-shadow:0 6px 0 #060c22;border:1px solid var(--line)}
  .btn.ghost:not(:disabled):active{box-shadow:0 2px 0 #060c22}
  /* a disabled button must not look tappable (sort "check" starts disabled, join button locks while fetching) */
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .hint{color:var(--muted);font-size:12px;margin-top:12px}
  .code-err{min-height:20px;margin-top:8px;color:var(--bad);font-size:13px;font-weight:800}
  .credit{color:var(--muted);font-size:11px;margin-top:14px;opacity:.7}
  .link-btn{background:none;color:var(--muted);font-size:12px;font-weight:700;text-decoration:underline;
            padding:8px;margin-top:8px;min-height:44px}
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:5px 10px;border-radius:99px;
       background:#0a1128;border:1px solid var(--line);color:var(--muted);margin:3px}
  .btn.adv-btn{background:linear-gradient(180deg,var(--purple),#7a4fd9);color:#0c0620;
       box-shadow:0 8px 0 #4a2e96,0 10px 24px rgba(179,136,255,.35)}
  .btn.adv-btn:active{box-shadow:0 3px 0 #4a2e96,0 6px 14px rgba(179,136,255,.3)}
  .btn.danger{background:#0e1738;color:var(--bad);box-shadow:0 6px 0 #060c22;border:1px solid var(--bad)}
  .btn.danger:active{box-shadow:0 2px 0 #060c22}
  .myclass-del{flex-shrink:0;background:none;color:var(--muted);font-size:18px;padding:6px 10px;
      min-height:44px;min-width:44px;border-radius:10px}
  .recap-title{margin-top:18px;font-weight:900;font-size:14px;color:var(--yellow)}
  .recap-list{list-style:none;margin:10px 0 0;padding:0;text-align:start;display:flex;flex-direction:column;gap:8px}
  .recap-list li{background:#0a1128;border:1px solid var(--line);border-radius:12px;padding:9px 12px;
       font-size:13px;line-height:1.4;color:var(--ink);opacity:0;animation:recapIn .4s ease forwards}
  @keyframes recapIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .onboard-list{display:flex;flex-direction:column;gap:12px;margin-top:16px;text-align:start}
  .onboard-step{display:flex;gap:12px;align-items:flex-start;background:#0a1128;border:1px solid var(--line);
      border-radius:14px;padding:12px}
  .onboard-num{flex:0 0 28px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
      font-weight:900;color:var(--c);border:2px solid var(--c);background:rgba(255,255,255,.03)}
  .onboard-text{font-size:14px;line-height:1.5;color:var(--ink)}
  .onboard-text b{color:var(--cyan)}
  .link-box{margin-top:8px;background:#0a1128;border:1px solid var(--line);border-radius:12px;padding:10px 12px;
      font-size:12px;color:var(--muted);word-break:break-all;text-align:center;direction:ltr}
  .topic-bar-row{margin-top:10px}
  .topic-bar-head{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .topic-bar-icon{width:20px;height:20px;flex-shrink:0}
  .topic-bar-icon .icon{width:100%;height:100%}
  .topic-bar-title{flex:1;min-width:0;font-weight:800;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .topic-bar-pct{font-weight:900;font-size:13px;color:var(--ink)}
  .topic-bar-track{height:10px;border-radius:99px;background:#0a1128;border:1px solid var(--line);overflow:hidden}
  .topic-bar-fill{height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .myclass-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .myclass-row{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;
      background:#0a1128;border:1px solid var(--line);border-radius:12px;padding:10px 12px;transition:border-color .12s}
  .myclass-row:active{transform:scale(.98)}
  .myclass-info{min-width:0;text-align:start}
  .myclass-name{font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .myclass-code{font-size:11px;color:var(--muted);direction:ltr;text-align:start}
  .myclass-count{font-weight:900;font-size:13px;color:var(--cyan);white-space:nowrap}

  /* ---------- Map ---------- */
  .map-title{text-align:center;margin-bottom:6px}
  .map{position:relative;margin:16px 0}
  .station{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);
    border-radius:20px;padding:14px 16px;margin:0;position:relative;transition:transform .1s;
    border-inline-start:6px solid var(--c)}
  .station.playable{cursor:pointer;box-shadow:0 0 0 1px var(--c),0 0 26px -6px var(--c)}
  .station.playable:active{transform:scale(.98)}
  .station.locked{opacity:.5;filter:grayscale(.4)}
  .station.done{}
  .st-emoji{font-size:30px;width:60px;height:60px;flex:0 0 60px;display:grid;place-items:center;
    background:#0a1128;border-radius:16px;border:1px solid var(--line);position:relative;z-index:1;
    color:var(--c);filter:drop-shadow(0 0 5px var(--c))}
  .st-body{flex:1;min-width:0}
  .st-body h3{font-size:17px;color:var(--c)}
  .st-body p{margin:3px 0 0;color:var(--muted);font-size:13px}
  .st-badge{font-size:26px;color:var(--c);filter:drop-shadow(0 0 8px var(--c))}
  .st-lock{font-size:20px;color:var(--muted)}
  .st-play{font-weight:900;color:var(--c);font-size:14px;white-space:nowrap}
  /* connecting trail between stations: mirrors .station's box model (border-inline-start + padding)
     so the line lands exactly under the icon column, regardless of card height/text wrap */
  .path-seg{display:flex;height:26px;box-sizing:border-box;
    border-inline-start:6px solid transparent;padding-inline:16px}
  .path-seg-track{flex:0 0 60px;display:flex;justify-content:center}
  .path-seg-line{width:4px;border-radius:2px;background:
     repeating-linear-gradient(var(--line),var(--line) 5px,transparent 5px,transparent 10px)}
  .path-seg-line.filled{background:var(--c);box-shadow:0 0 10px -2px var(--c)}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 1px var(--c),0 0 26px -6px var(--c)}
                   50%{box-shadow:0 0 0 2px var(--c),0 0 34px 0px var(--c)}}
  .station.next{animation:pulse 1.6s infinite}
  .station.clickable{cursor:pointer}
  .station.clickable:active{transform:scale(.985)}
  .map-footer{text-align:center;margin-top:6px}
  .save-note{text-align:center;color:var(--muted);font-size:11px;margin-top:14px;opacity:.75}
  .sticky-head{position:sticky;top:0;z-index:5;margin:-20px -20px 14px;padding:14px 20px 10px;
       background:var(--panel);backdrop-filter:blur(8px);border-radius:20px 20px 0 0;
       box-shadow:0 10px 14px -10px rgba(0,0,0,.35)}
  .chal-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
  .mini-btn{background:#0a1128;border:1px solid var(--line);border-radius:12px;padding:7px 10px;
            font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap;
            min-height:44px;display:inline-flex;align-items:center}
  .mini-btn:active{transform:scale(.94)}

  /* ---------- Challenge ---------- */
  .chip{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13px;
        padding:6px 12px;border-radius:99px;background:#0a1128;border:1px solid var(--c);color:var(--c)}
  .dots{display:flex;gap:6px;justify-content:center;margin:14px 0}
  .dot{width:10px;height:10px;border-radius:50%;background:#1a2547;border:1px solid var(--line)}
  .dot.on{background:var(--c);box-shadow:0 0 8px var(--c)}
  .dot.cur{transform:scale(1.4)}
  .scenario{font-size:19px;font-weight:700;line-height:1.5;margin:6px 0 4px}
  .prompt{color:var(--muted);font-weight:700;font-size:14px;margin-bottom:12px}
  .options{display:flex;flex-direction:column;gap:12px}
  .opt{width:100%;text-align:start;padding:16px 18px;border-radius:16px;font-size:17px;font-weight:700;
    background:#0e1738;border:2px solid var(--line);transition:transform .06s,border-color .1s,background .1s}
  .opt:active{transform:scale(.99)}
  .opt.correct{border-color:var(--good);background:rgba(0,230,118,.14);box-shadow:0 0 20px -6px var(--good)}
  .opt.wrong{border-color:var(--bad);background:rgba(255,77,109,.14);animation:shake .35s}
  .opt.dim{opacity:.5}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}60%{transform:translateX(8px)}}

  /* ---------- Feedback modal (always visible, never off-screen) ---------- */
  .fb-overlay{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;
    background:rgba(4,8,20,.55);backdrop-filter:blur(3px);animation:fadein .2s;
    padding:12px 12px calc(14px + env(safe-area-inset-bottom))}
  .fb-modal{width:100%;max-width:560px;background:var(--panel-solid);border:2px solid var(--line);
    border-radius:22px;padding:22px 20px;text-align:center;animation:slideup .28s cubic-bezier(.2,.9,.3,1);
    box-shadow:0 -10px 44px -8px rgba(0,0,0,.65)}
  .fb-modal.good{border-color:var(--good);box-shadow:0 0 44px -10px var(--good)}
  .fb-modal.bad{border-color:var(--yellow);box-shadow:0 0 44px -10px var(--yellow)}
  .fb-emoji{font-size:44px;line-height:1;margin-bottom:4px;display:flex;justify-content:center;
            filter:drop-shadow(0 0 8px currentColor)}
  .fb-modal.good .fb-emoji{color:var(--good)}
  .fb-modal.bad .fb-emoji{color:var(--yellow)}
  .fb-modal .fb-title{font-weight:900;font-size:20px;margin-bottom:8px}
  .fb-modal.good .fb-title{color:var(--good)}
  .fb-modal.bad .fb-title{color:var(--yellow)}
  .fb-modal .fb-text{line-height:1.55;color:var(--ink);font-size:15px;opacity:.96}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @keyframes slideup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

  /* ---------- Sort mini-game ---------- */
  .sort-items{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0 6px;min-height:44px;
              border-radius:16px;transition:outline-color .12s,background .12s}
  .sort-instr{color:var(--muted);font-size:13px;text-align:center;margin-bottom:6px}
  .item{padding:11px 15px;border-radius:14px;background:#0e1738;border:2px solid var(--line);
        font-weight:800;font-size:15px;transition:transform .08s,opacity .12s;touch-action:none;cursor:grab}
  .item:active{transform:scale(.96)}
  .item.selected{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(255,213,79,.3);color:var(--yellow)}
  .item.dragging-source{opacity:.3}
  .item.drag-ghost{position:fixed;top:0;left:0;z-index:90;pointer-events:none;cursor:grabbing;
        transform:scale(1.08) rotate(-2deg);box-shadow:0 14px 28px -8px rgba(0,0,0,.55);opacity:.96}
  .bins{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  .bin{background:#0a1128;border:2px dashed var(--line);border-radius:18px;padding:12px;min-height:120px;
       transition:border-color .12s,box-shadow .12s,background .12s}
  .bin.armed{border-color:var(--yellow);box-shadow:0 0 18px -4px var(--yellow)}
  .bin.drag-over,.sort-items.drag-over{border-color:var(--yellow);outline:2px dashed var(--yellow);
       box-shadow:0 0 22px -2px var(--yellow);background:rgba(255,213,79,.08)}
  .bin h4{margin:0 0 10px;text-align:center;font-size:15px}
  .bin .drop{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:20px}
  .binL h4{color:var(--good)} .binR h4{color:var(--bad)}

  /* ---------- Station complete / certificate ---------- */
  .badge-pop{font-size:84px;display:flex;justify-content:center;color:var(--c);
             animation:pop .5s cubic-bezier(.2,1.4,.4,1);filter:drop-shadow(0 0 22px var(--c))}
  @keyframes pop{from{transform:scale(0) rotate(-25deg)}to{transform:scale(1)}}
  .cert{border:3px solid var(--yellow);border-radius:24px;padding:26px 20px;text-align:center;
        background:radial-gradient(circle at 50% 0%,rgba(255,213,79,.14),transparent 70%),var(--panel-solid);
        box-shadow:0 0 40px -8px var(--yellow);flex-shrink:0}
  .cert .seal{font-size:56px;color:var(--yellow);display:flex;justify-content:center;filter:drop-shadow(0 0 16px var(--yellow))}
  .cert .name{font-size:30px;font-weight:900;color:var(--yellow);margin:8px 0}
  .cert .badges{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;font-size:28px;margin:14px 0}
  .cert .badges .icon{filter:drop-shadow(0 0 6px currentColor)}
  .stat-row{display:flex;gap:12px;justify-content:center;margin:14px 0;flex-wrap:wrap}
  .stat{background:#0a1128;border:1px solid var(--line);border-radius:14px;padding:10px 18px;min-width:90px}
  .stat b{display:block;font-size:26px;color:var(--cyan)}
  .stat span{font-size:12px;color:var(--muted)}

  .fade{animation:fade .35s}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* hover effects only for devices with a real pointer — touchscreens fire a synthetic :hover on tap
     that then sticks until the next tap elsewhere, which looked like an answer was pre-marked/selected */
  @media (hover: hover) and (pointer: fine){
    .opt:hover{border-color:var(--c)}
    .myclass-row:hover{border-color:var(--cyan)}

/* ---------- classroom mode (optional, opt-in — only touches the network if a class code is used) ----------
   Talks directly to Supabase's REST API (PostgREST) with plain fetch — no SDK, keeps the app dependency-free.
   The class "code" doubles as the access secret (like a Kahoot PIN): whoever has it can join or view the roster.
   No login, no PII beyond the display name the player already chose. */
const SB_URL='https://kqdnvdwznyxgaxzjytjl.supabase.co';
const SB_KEY='sb_publishable_FU3z8in7ZztjPvInBeG8Sg_nKOuwPjV';
async function sbFetch(path, opts={}){
  const res=await fetch(`${SB_URL}/rest/v1/${path}`, {
    ...opts,
    headers:{ 'apikey':SB_KEY, 'Authorization':`Bearer ${SB_KEY}`, 'Content-Type':'application/json', ...(opts.headers||{}) }
  });
  if(!res.ok) throw new Error('sb '+res.status);
  return res.status===204 ? null : res.json();
}
function genClassCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';  // no 0/O/1/I — easier to read/type aloud in class
  let s=''; for(let i=0;i<6;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
async function createClass(name){
  for(let i=0;i<5;i++){
    const code=genClassCode();
    try{
      const rows=await sbFetch('classes',{method:'POST',headers:{'Prefer':'return=representation'},
        body:JSON.stringify({code, name:(name||'').trim()||'כיתה ללא שם'})});
      return rows[0];
    }catch(e){ /* code collision (rare) — try another */ }
  }
  throw new Error('could not create class');
}
async function findClassByCode(code){
  const rows=await sbFetch(`classes?code=eq.${encodeURIComponent((code||'').trim().toUpperCase())}&select=*`);
  return rows[0]||null;
}

// Class-wide aggregate only — never returns individual names/scores (privacy: this powers the parent-facing link).
async function loadClassResults(code){
  const cls=await findClassByCode(code);
  if(!cls) return null;
  const students=await sbFetch(`students?class_id=eq.${cls.id}&select=score,stations_done,total_stations,weak_topics,done_stations,advanced_done`);
  const n=students.length;
  const avgScore=n? Math.round(students.reduce((s,x)=>s+x.score,0)/n) : 0;
  const completedCount=students.filter(x=>x.stations_done>=x.total_stations).length;
  const advancedCount=students.filter(x=>x.advanced_done).length;
  const topicStats=STATIONS.map(st=>{
    const completedIt=students.filter(x=>Array.isArray(x.done_stations)&&x.done_stations.includes(st.id));
    const struggled=completedIt.filter(x=>Array.isArray(x.weak_topics)&&x.weak_topics.includes(st.id)).length;
    return { id:st.id, title:st.title, icon:st.icon, color:st.color,
      attempted:completedIt.length, struggled, pct: completedIt.length? Math.round(100*(completedIt.length-struggled)/completedIt.length) : null };
  });
  return { cls, n, avgScore, completedCount, advancedCount, topicStats };
}

let actx=null, master=null;
function ac(){
  if(!actx){ try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain(); master.gain.value=.9;
    const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2600; lp.Q.value=.2;
    master.connect(lp); lp.connect(actx.destination);
  }catch(e){} }
  return actx;
}
function tone(freq,dur,type,vol,when){
  if(S.muted) return; const c=ac(); if(!c) return;
  type=type||'sine'; vol=(vol==null?.12:vol); when=when||0;
  const o=c.createOscillator(), g=c.createGain(), t=c.currentTime+when;
  o.type=type; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+.03);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(master||c.destination); o.start(t); o.stop(t+dur+.05);
}

function countDone(){
  // completed challenges = finished stations (full) + saved/live partial progress
  let n=0;
  STATIONS.forEach(st=>{
    if(S.done.includes(st.id)){ n+=st.challenges.length; return; }
    let ci=0;
    if(cur && !cur.practice && !cur.advanced && STATIONS[cur.si] && STATIONS[cur.si].id===st.id) ci=cur.ci;
    else if(S.partial[st.id]) ci=S.partial[st.id];
    n+=ci;
  });
  return n;
}

        style="width:100%;margin-top:8px;padding:14px;border-radius:14px;background:#0a1128;
        border:2px solid var(--cyan);color:var(--ink);font-size:20px;text-align:center;font-weight:900;letter-spacing:5px;
        box-shadow:0 0 14px -4px var(--cyan)" />
      <div id="codeErr" class="code-err" role="alert"></div>
      <button class="btn big" id="joinBtn">הצטרף/י לכיתה ▶</button>
    </div>
  `);
  const inp=$('#classCodeInput'), err=$('#codeErr'), joinBtn=$('#joinBtn');
  inp.focus();
  inp.oninput=()=>{ inp.value=inp.value.toUpperCase(); err.textContent=''; err.style.color=''; inp.style.borderColor='var(--cyan)'; };
  const proceed=()=>{ S.classAsked=true; save(); S.onboarded ? mapScreen() : onboardingScreen(); };
  const showErr=(msg)=>{
    err.textContent=msg; inp.style.borderColor='var(--bad)';
    inp.focus(); inp.select();                       // focus-management: land the kid back on the bad field
    joinBtn.disabled=false; joinBtn.textContent='הצטרף/י לכיתה ▶';
  };
  joinBtn.onclick=async()=>{
    const code=inp.value.trim();
    if(!code) return showErr('צריך להקליד קוד כיתה כדי להמשיך.');
    sfx.click();
    joinBtn.disabled=true; joinBtn.textContent='מצטרף/ת…';
    let cls=null;
    try{ cls=await joinClass(code); }catch(e){ return showErr('אין חיבור לאינטרנט כרגע. נסו שוב.'); }
    if(!cls) return showErr('הקוד הזה לא נמצא. כדאי לבדוק שוב עם המורה.');
    sfx.badge(); syncStudentProgress();
    // Confirm which class they actually landed in before moving on — a mistyped-but-valid
    // code should be visible to the kid, not silently accepted.
    err.style.color='var(--green)';
    err.textContent=`הצטרפת לכיתת ${cls.name||cls.code}! ✅`;
    joinBtn.textContent='מצוין! ממשיכים…';
    setTimeout(proceed, 1100);
  };
  inp.onkeydown=(e)=>{ if(e.key==='Enter') joinBtn.click(); };
}

function linkFor(param, code){ return `${location.origin}${location.pathname}?${param}=${encodeURIComponent(code)}`; }
// Student link carries the class name too (?cn=) so a joining kid sees "כיתת X" instantly,
// without waiting on the join fetch to resolve — pure display hint, joinClass() re-confirms it from the DB.
function studentLinkFor(cls){ return `${linkFor('class',cls.code)}&cn=${encodeURIComponent(cls.name||'')}`; }
function copyText(text, btn){
  const flash=(msg)=>{ if(!btn) return; const orig=btn.textContent; btn.textContent=msg; setTimeout(()=>{ btn.textContent=orig; },2200); };
  const fallback=()=>{
    try{
      const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
      flash('✅ הועתק!');
    }catch(e){ flash('🔗 '+text); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(()=>flash('✅ הועתק!')).catch(fallback);
  else fallback();
}

// "How many classes has this teacher started, and how many kids joined each?" — a locally-remembered
// list (this device only, no login) with a live student count fetched per class.
async function renderMyClassesList(){
  const mine=getMyClasses();
  const wrap=$('#myClassesWrap'); if(!wrap) return;
  if(!mine.length){ wrap.innerHTML=''; return; }
  wrap.innerHTML=`<div class="recap-title" style="margin-top:20px">📚 הכיתות שלי (${mine.length})</div>
    <p class="subtitle" id="myClassesLoading">טוען…</p>`;
  let counts;
  try{
    counts=await Promise.all(mine.map(async c=>{
      try{ const cls=await findClassByCode(c.code); if(!cls) return {...c, n:null, gone:true};
        const n=await countStudents(cls.id); return {...c, name:cls.name, n}; }
      catch(e){ return {...c, n:null}; }
    }));
  }catch(e){ counts=mine.map(c=>({...c, n:null})); }
  const loading=$('#myClassesLoading'); if(!loading) return;
  loading.outerHTML=`<div class="myclass-list">${counts.map(c=>`
    <div class="myclass-row" data-code="${escapeHtml(c.code)}" data-id="${escapeHtml(c.id||'')}">
      <div class="myclass-info">
        <div class="myclass-name">${escapeHtml(c.name||'כיתה')}</div>
        <div class="myclass-code">PIN: ${escapeHtml(c.code)}</div>
      </div>
      <div class="myclass-count">${c.gone? 'לא נמצאה' : (c.n==null?'—':c.n+' 🧑‍🎓')}</div>
      <button class="myclass-del" data-del="${escapeHtml(c.code)}" data-delid="${escapeHtml(c.id||'')}" title="מחק/י כיתה">🗑️</button>
    </div>`).join('')}</div>`;
  document.querySelectorAll('.myclass-row').forEach(row=>{
    row.onclick=(e)=>{ if(e.target.closest('.myclass-del')) return; sfx.click(); teacherClassReadyScreen(row.dataset.code); };
  });
  document.querySelectorAll('.myclass-del').forEach(btn=>{
    btn.onclick=async(e)=>{
      e.stopPropagation();
      const code=btn.dataset.del, id=btn.dataset.delid;
      if(!confirm(`למחוק לצמיתות את הכיתה ${code}? כל נתוני התלמידים שהצטרפו אליה יימחקו ולא ניתן לשחזר.`)) return;
      sfx.click();
      forgetMyClass(code);
      try{ if(id) await deleteClass(id); else { const cls=await findClassByCode(code); if(cls) await deleteClass(cls.id); } }
      catch(e){ /* already forgotten locally even if the network call failed */ }
      renderMyClassesList();
    };
  });
}

/* ----- Map ----- */
function firstIncomplete(){ for(let i=0;i<STATIONS.length;i++){ if(!S.done.includes(STATIONS[i].id)) return i; } return -1; }
function mapScreen(){
  cur=null; updateHUD();
  const nextIdx=firstIncomplete();
  let nodes='';
  STATIONS.forEach((st,i)=>{
    const done=S.done.includes(st.id);
    const playable = !done && i===nextIdx;      // sequential unlock
    const locked = !done && !playable;
    const n=st.challenges.length;
    const partial = (!done && S.partial[st.id]) ? S.partial[st.id] : 0;
    let right, sub;
    if(done){ right=`<div class="st-badge">${icon(st.icon)}</div>`; sub='✔ הושלם · '+st.badgeName+' · הקש/י לתרגול 🔁'; }
    else if(playable){
      right=`<div class="st-play">${partial?('המשך '+partial+'/'+n):'שחק'} ▶</div>`;
      sub = partial ? ('בתהליך · '+partial+'/'+n+' הושלמו') : 'התחנה הבאה שלך';
    } else { right=`<div class="st-lock">${icon('lock')}</div>`; sub='ננעל — סיים/י את הקודמת'; }
    const clickable = done || playable;
    nodes += `
      <div class="station ${done?'done':''} ${playable?'playable next':''} ${locked?'locked':''} ${clickable?'clickable':''}"
           style="--c:${st.color}" data-i="${i}">
        <div class="st-emoji">${icon(st.icon)}</div>
        <div class="st-body">
          <h3>${st.title}</h3>
          <p>${sub}</p>
        </div>
        ${right}
      </div>`;
    if(i<STATIONS.length-1){                     // trail segment down to the next station — lit up once this one is done
      nodes += `<div class="path-seg"><div class="path-seg-track"><div class="path-seg-line ${done?'filled':''}" style="--c:${st.color}"></div></div></div>`;
    }
  });
  const allDone = S.done.length===STATIONS.length;
  const pendingReview = allDone && S.weakTopics && S.weakTopics.length>0 && !S.reviewDone;
  const advOn = S.advRound && S.advRound.ci < S.advRound.ids.length;
  const advLabel = advOn ? `🌟 המשך אתגר מתקדם (${S.advRound.ci}/${S.advRound.ids.length})` : (advancedMaxed() ? '🏆 האתגר המתקדם הושלם' : '🌟 אתגר מתקדם — שאלות קשות יותר');
  go(`
    <div class="map-title">
      <div class="chip" style="--c:var(--cyan)">🗺️ מפת המשימות</div>
      <h2 style="margin-top:10px">שלום, <span style="color:var(--cyan)">${escapeHtml(S.name)}</span> 👋</h2>
      <p class="subtitle">${allDone?('כל הכבוד, '+escapeHtml(S.name)+'! סיימת את כל התחנות 🎖️'):'עבור/י תחנה־תחנה והפוך/הפכי לסוכן/ת מוסמך/ת'}</p>
    </div>
    <div class="map">${nodes}</div>
    ${allDone? `<button class="btn big" id="certBtn">${pendingReview?'📝 סבב חיזוק קצר לפני התעודה':'🎖️ לתעודת הסוכן/ת'}</button>
    <button class="btn adv-btn big" id="advBtn" style="margin-top:10px">${advLabel}</button>
    ${advOn?`<button class="btn ghost" id="advNewBtn" style="margin-top:8px">🔄 התחל סבב חדש במקום זה</button>`:''}`:''}
    <div class="save-note">💾 ההתקדמות שלך נשמרת אוטומטית במכשיר הזה</div>
    <div class="map-footer"><button class="btn ghost" id="resetAllBtn">🗑️ אפס את כל המשחק</button></div>
  `);
  document.querySelectorAll('.station.clickable').forEach(el=>{
    el.onclick=()=>{ sfx.click(); startStation(+el.dataset.i); };
  });
  const cb=$('#certBtn'); if(cb) cb.onclick=()=>{ sfx.click(); goToCertOrReview(); };
  const ab=$('#advBtn'); if(ab) ab.onclick=()=>{ sfx.click(); openAdvanced(); };
  const anb=$('#advNewBtn'); if(anb) anb.onclick=()=>{ if(confirm('להתחיל סבב אתגר מתקדם חדש? הסבב הנוכחי בתהליך יימחק.')){ sfx.click(); startAdvanced(); } };
  $('#resetAllBtn').onclick=()=>{
    if(confirm('לאפס את כל המשחק ולהתחיל מההתחלה? כל ההתקדמות תימחק.')){
      sfx.click(); S.score=0; S.done=[]; S.partial={}; S.weakTopics=[]; S.reviewDone=false; delete S.advRound; streak=0; save(); updateHUD(); startScreen();
    }
  };
}

/* ----- Station flow ----- */
let advStation=null;          // holds the virtual "advanced challenge" station object while active
let advRoundStartScore=0;     // score snapshot at the start of an advanced round (to show round bonus)
let practiceStation=null;     // holds a shuffled-pool variant of a station while replaying it for practice
let reviewStation=null;       // holds the virtual "weak-topic review round" station object while active
function curStation(){
  if(cur && cur.advanced) return advStation;
  if(cur && cur.review) return reviewStation;
  if(cur && cur.practice && practiceStation) return practiceStation;
  return cur ? STATIONS[cur.si] : null;
}
function buildPracticeStation(st){
  // mix the original questions with the extra pool and take a fresh random subset each replay
  const pool=shuffle([...st.challenges, ...(st.extra||[])]);
  return {...st, challenges:pool.slice(0, st.challenges.length)};
}

function startStation(si){
  const st=STATIONS[si];
  const practice = S.done.includes(st.id);                 // replaying a finished station = practice (no score change)
  practiceStation = practice ? buildPracticeStation(st) : null;
  let resume = (!practice && S.partial[st.id]) ? S.partial[st.id] : 0;
  if(resume>=st.challenges.length) resume=0;
  cur={si, ci:resume, lives:LIVES, firstTry:true, practice, hadMistake:false};
  renderChallenge();
}

function pickAdvancedRound(){
  // one question per topic category, so every round mixes ALL topics (never just one)
  const byCat={};
  ADVANCED.forEach(q=>{ (byCat[q.cat]=byCat[q.cat]||[]).push(q); });
  const cats=shuffle(Object.keys(byCat));
  return cats.map(c=>shuffle(byCat[c].slice())[0]);
}
function buildAdvStation(list){
  return { id:'advanced', title:'אתגר מתקדם', icon:'star', color:'var(--purple)',
           badgeName:'מומחה/ית סייבר', challenges:list };
}
function startAdvanced(){
  advStation=buildAdvStation(pickAdvancedRound());
  advRoundStartScore=S.score;
  S.advRound={ids:advStation.challenges.map(c=>c.id), ci:0, lives:LIVES}; save();
  cur={si:'adv', ci:0, lives:LIVES, firstTry:true, practice:false, advanced:true};
  renderChallenge();
}
function resumeAdvanced(){
  if(!S.advRound){ startAdvanced(); return; }
  const list=S.advRound.ids.map(id=>ADVANCED.find(q=>q.id===id)).filter(Boolean);
  if(!list.length || S.advRound.ci>=list.length){ startAdvanced(); return; }
  advStation=buildAdvStation(list);
  advRoundStartScore=S.score;
  cur={si:'adv', ci:S.advRound.ci, lives:S.advRound.lives, firstTry:true, practice:false, advanced:true};
  renderChallenge();
}
const ADVANCED_ROUND_LIMIT = 1;   // after this many completed rounds, the advanced challenge is finished
function advancedMaxed(){ return (S.advancedPlays||0) >= ADVANCED_ROUND_LIMIT; }
function roundsPhrase(n){ return n===1 ? 'סבב אחד' : n+' סבבים'; }
function openAdvanced(){
  if(S.advRound && S.advRound.ci < S.advRound.ids.length) resumeAdvanced();
  else if(advancedMaxed()) advancedFinaleScreen();
  else startAdvanced();
}

        <div class="stat-row"><div class="stat"><b>${S.score}</b><span>נקודות סה"כ</span></div></div>

function renderChallenge(){
  const st=curStation(), ch=st.challenges[cur.ci];
  cur.firstTry=true;
  if(cur.advanced){ if(S.advRound){ S.advRound.ci=cur.ci; S.advRound.lives=cur.lives; save(); } }
  else if(!cur.practice && !cur.review){ S.partial[st.id]=cur.ci; save(); }  // remember where we are (resume support)
  updateHUD();
  const dots=st.challenges.map((_,i)=>`<div class="dot ${i<cur.ci?'on':''} ${i===cur.ci?'cur on':''}" style="--c:${st.color}"></div>`).join('');
  const head=`
    <div class="sticky-head">
      <div class="chal-top">
        <button class="mini-btn" id="toMapBtn">🗺️ מפה</button>
        <div class="chip" style="--c:${st.color}">${icon(st.icon)} ${st.title}${cur.practice?' · תרגול':''}${cur.review?' · חיזוק':''}</div>
        <button class="mini-btn" id="resetStageBtn">🔄 אפס שלב</button>
      </div>
      <div class="dots">${dots}</div>
    </div>`;
  if(ch.type==='quiz') renderQuiz(st,ch,head);
  else renderSort(st,ch,head);
  $('#toMapBtn').onclick=()=>{ sfx.click(); mapScreen(); };
  $('#resetStageBtn').onclick=()=>{
    if(!confirm('להתחיל את השלב הזה מחדש מההתחלה?')) return;
    sfx.click();
    if(cur.advanced) startAdvanced();
    else if(cur.review) startReviewRound();
    else { S.partial[st.id]=0; save(); startStation(cur.si); }
  };
}

function renderQuiz(st,ch,head){
  const order=shuffle(ch.options.map((_,i)=>i));            // randomize option order every time it's shown
  const opts=order.map((origIdx,pos)=>`<button class="opt" data-i="${pos}" style="--c:${st.color}">${ch.options[origIdx]}</button>`).join('');
  go(`<div class="card" style="--c:${st.color}">
        ${head}
        <div class="scenario">${ch.text}</div>
        <div class="prompt">${ch.prompt||''}</div>
        <div class="options" id="opts">${opts}</div>      </div>`);
  document.querySelectorAll('#opts .opt').forEach(b=>{
    b.onclick=()=>answerQuiz(+b.dataset.i, st, ch, order);
  });
}
function answerQuiz(pos, st, ch, order){
  const btns=document.querySelectorAll('#opts .opt');
  if(btns[0] && btns[0].disabled) return;      // already resolving this question — ignore a stray extra tap
  btns.forEach(b=>b.disabled=true);            // lock immediately so a rapid double-tap can't mark a second option
  const correctPos = order.indexOf(ch.answer);
  const correct = pos===correctPos;
  if(correct){
    btns.forEach((b,bi)=>{ if(bi===pos)b.classList.add('correct'); else b.classList.add('dim'); });
    sfx.correct(); haptic.correct();
    awardCorrect(st,ch);
  } else {
    const b=btns[pos]; b.classList.add('wrong');
    cur.lives--; cur.firstTry=false; cur.hadMistake=true; streak=0; sfx.wrong(); haptic.wrong(); updateHUD();
    showFeedback(false, ch.explain, ()=>{
      b.classList.remove('wrong');
      if(cur.lives<=0){ stationFailed(st); }
      else btns.forEach(bt=>bt.disabled=false);  // unlock for the retry (same shuffled order)
    });
  }
}

/* ----- Sort mini-game (tap to place — works with touch & mouse) ----- */
function renderSort(st,ch,head){
  // shuffle a working copy
  const items=ch.items.map((it,idx)=>({...it,idx,placed:null}));
  shuffle(items);
  cur._sort={items,selected:null};
  go(`<div class="card" style="--c:${st.color}">
        ${head}
        <div class="scenario">${ch.text}</div>
        <div class="sort-instr">גררו פריט לתיבה המתאימה (ואפשר לגרור בחזרה) — או הקישו על פריט ואז על תיבה 👇</div>
        <div class="sort-items" id="pool"></div>
        <div class="bins">
          <div class="bin binL" data-bin="0"><h4>${ch.binL}</h4><div class="drop" id="d0"></div></div>
          <div class="bin binR" data-bin="1"><h4>${ch.binR}</h4><div class="drop" id="d1"></div></div>
        </div>
        <button class="btn big" id="checkBtn" style="margin-top:16px" disabled>בדוק/י ✔</button>      </div>`);
  document.querySelectorAll('.bin').forEach(bin=> bin.onclick=()=>placeSelected(+bin.dataset.bin, st, ch));
  $('#checkBtn').onclick=()=>checkSort(st,ch);
  drawSort(st);
}
function drawSort(st){
  const {items,selected}=cur._sort;
  const pool=$('#pool'); pool.innerHTML='';
  $('#d0').innerHTML=''; $('#d1').innerHTML='';
  items.forEach(it=>{
    const el=document.createElement('button');
    el.className='item'+(selected===it.idx?' selected':'');
    el.style.setProperty('--c',st.color);
    el.textContent=it.t;
    el.addEventListener('pointerdown', e=>onItemPointerDown(e, it.idx, st));
    if(it.placed===null) pool.appendChild(el);
    else $('#d'+it.placed).appendChild(el);
  });
  // arm bins if an item is selected
  document.querySelectorAll('.bin').forEach(b=> b.classList.toggle('armed', selected!==null));
  const allPlaced=items.every(it=>it.placed!==null);
  $('#checkBtn').disabled=!allPlaced;
  updateHUD();
}
function selectItem(idx, st){ cur._sort.selected = (cur._sort.selected===idx?null:idx); sfx.click(); drawSort(st); }
function placeSelected(bin, st){
  const s=cur._sort; if(s.selected===null) return;
  const it=s.items.find(i=>i.idx===s.selected); it.placed=bin; s.selected=null; sfx.click(); drawSort(st);
}

/* ----- drag & drop for sort items (pointer events: mouse + touch + pen) ----- */
const DRAG_THRESHOLD=7;
let dragState=null;
function onItemPointerDown(e, idx, st){
  if(e.button!=null && e.button!==0) return;
  const el=e.currentTarget, rect=el.getBoundingClientRect();
  dragState={ idx, st, startX:e.clientX, startY:e.clientY,
    offX:e.clientX-rect.left, offY:e.clientY-rect.top, w:rect.width,
    dragging:false, ghost:null, sourceEl:el, pointerId:e.pointerId };
  try{ el.setPointerCapture(e.pointerId); }catch(err){}
  el.addEventListener('pointermove', onItemPointerMove);
  el.addEventListener('pointerup', onItemPointerUp);
  el.addEventListener('pointercancel', onItemPointerCancel);
}
function onItemPointerMove(e){
  if(!dragState) return;
  const dx=e.clientX-dragState.startX, dy=e.clientY-dragState.startY;
  if(!dragState.dragging && Math.hypot(dx,dy)>DRAG_THRESHOLD){
    dragState.dragging=true;
    dragState.sourceEl.classList.add('dragging-source');
    const g=dragState.sourceEl.cloneNode(true);
    g.className='item drag-ghost'; g.style.width=dragState.w+'px';
    document.body.appendChild(g); dragState.ghost=g;
  }
  if(dragState.dragging){
    dragState.ghost.style.left=(e.clientX-dragState.offX)+'px';
    dragState.ghost.style.top=(e.clientY-dragState.offY)+'px';
    document.querySelectorAll('.bin,.sort-items').forEach(z=>z.classList.remove('drag-over'));
    const under=document.elementFromPoint(e.clientX,e.clientY);
    const target=under && (under.closest('.bin')||under.closest('.sort-items'));
    if(target) target.classList.add('drag-over');
  }
}
function cleanupDrag(){
  const ds=dragState; if(!ds) return;
  ds.sourceEl.removeEventListener('pointermove', onItemPointerMove);
  ds.sourceEl.removeEventListener('pointerup', onItemPointerUp);
  ds.sourceEl.removeEventListener('pointercancel', onItemPointerCancel);
  try{ ds.sourceEl.releasePointerCapture(ds.pointerId); }catch(err){}
  document.querySelectorAll('.bin,.sort-items').forEach(z=>z.classList.remove('drag-over'));
  if(ds.ghost) ds.ghost.remove();
  ds.sourceEl.classList.remove('dragging-source');
}
function onItemPointerUp(e){
  if(!dragState) return;
  const ds=dragState, wasDragging=ds.dragging;
  cleanupDrag();
  if(wasDragging){
    const under=document.elementFromPoint(e.clientX,e.clientY);
    const bin=under && under.closest('.bin');
    const pool=under && under.closest('.sort-items');
    const it=cur._sort.items.find(i=>i.idx===ds.idx);
    if(bin){ it.placed=+bin.dataset.bin; sfx.click(); }
    else if(pool){ it.placed=null; sfx.click(); }
    cur._sort.selected=null;
    dragState=null;
    drawSort(ds.st);
  } else {
    dragState=null;
    selectItem(ds.idx, ds.st);
  }
}
function onItemPointerCancel(){ cleanupDrag(); dragState=null; }
function checkSort(st,ch){
  if($('#checkBtn').disabled) return;         // already resolving this question — ignore a stray extra tap
  $('#checkBtn').disabled=true;
  const items=cur._sort.items;
  const wrong = items.filter(it=>it.placed!==it.bin).length;
  if(wrong===0){
    sfx.correct(); haptic.correct();
    awardCorrect(st,ch);
  } else {
    cur.lives--; cur.firstTry=false; cur.hadMistake=true; streak=0; sfx.wrong(); haptic.wrong(); updateHUD();
    // No per-item reveal — teach the principle and let them rethink (their arrangement stays).
    const hint = ch.explain + ` <b>(עדיין ${wrong} לא במקום הנכון — חשוב/י איזה צד מתאים לכל פריט.)</b>`;
    showFeedback(false, hint, ()=>{ if(cur.lives<=0){ stationFailed(st); } else $('#checkBtn').disabled=false; });
  }
}

/* ----- shared correct / feedback / progression ----- */
function shortRecap(text){
  const m=text.match(/^[^.!?—]+[.!?]?/);
  let s=(m?m[0]:text).trim();
  if(s.length>78) s=s.slice(0,75)+'…';
  return s;
}
let streak=0;                  // consecutive first-try-correct answers this session (not persisted)
const STREAK_MILESTONE=3, STREAK_BONUS=5;
function awardCorrect(st,ch){
  const pts = cur.practice ? 0 : (cur.advanced ? (cur.firstTry?15:8) : (cur.firstTry?10:5));
  let bonus=0;
  if(cur.firstTry){
    streak++;
    if(!cur.practice && streak%STREAK_MILESTONE===0) bonus=STREAK_BONUS;
  }
  if(!cur.practice){ S.score+=pts+bonus; save(); updateHUD(); }
  showFeedback(true, ch.explain, ()=>nextChallenge(st), pts, bonus, streak);
}
function showFeedback(good, text, onNext, pts, bonus, streakCount){
  document.querySelectorAll('.fb-overlay').forEach(el=>el.remove());  // guard against a stray duplicate modal
  const opener = good ? pick(CORRECT_OPENERS,_pl)(S.name) : pick(WRONG_OPENERS,_wl)(S.name);
  const base = good ? (pts>0 ? `${opener} · +${pts} נק'` : opener) : opener;
  const title = (good && bonus>0) ? `${base} · רצף ${streakCount}! +${bonus}` : base;
  const ov=document.createElement('div'); ov.className='fb-overlay';
  ov.innerHTML=`
    <div class="fb-modal ${good?'good':'bad'}">
      <div class="fb-emoji">${good?icon('check'):icon('lightbulb')}</div>
      <div class="fb-title">${title}</div>
      <div class="fb-text">${text}</div>
      <button class="btn big" id="fbBtn" style="margin-top:16px">${good?'המשך ▶':'נסה/י שוב 🔁'}</button>
    </div>`;
  document.body.appendChild(ov);
  ov.querySelector('#fbBtn').onclick=()=>{ sfx.click(); ov.remove(); if(onNext) onNext(); };
}
function nextChallenge(st){
  cur.ci++;
  if(cur.ci>=st.challenges.length) stationComplete(st);
  else renderChallenge();
}
function stationFailed(st){
  const wasAdvanced=cur.advanced, wasReview=cur.review, si=cur.si;
  if(wasAdvanced){ delete S.advRound; save(); }
  else if(!cur.practice && !wasReview){ S.partial[st.id]=0; save(); }
  haptic.failed();
  go(`<div class="card center" style="--c:${st.color}">
        <div style="font-size:64px;display:flex;justify-content:center;color:var(--bad);filter:drop-shadow(0 0 14px var(--bad))">${icon('crackedheart')}</div>
        <h2 style="color:var(--bad)">נגמרו החיים בתחנה זו</h2>
        <p class="subtitle">זה בסדר גמור, ${escapeHtml(S.name)} — סוכנים לומדים מניסיון! ננסה את התחנה שוב מההתחלה.</p>
        <div class="chip" style="--c:${st.color};margin-top:12px">${icon(st.icon)} ${st.title}</div>
        <button class="btn big" id="retryBtn">נסה/י את התחנה שוב 🔁</button>
        <button class="btn ghost big" id="backBtn" style="margin-top:10px">חזרה למפה 🗺️</button>
      </div>`);
  $('#retryBtn').onclick=()=>{ sfx.click(); wasAdvanced?startAdvanced():wasReview?startReviewRound():startStation(si); };
  $('#backBtn').onclick=()=>{ sfx.click(); mapScreen(); };
}
function stationComplete(st){
  if(cur.review){                                            // weak-topic review round finished
    S.reviewDone=true; S.weakTopics=[]; save();
    cur=null; updateHUD(); sfx.win(); haptic.badge(); burst('var(--green)');
    go(`<div class="card center" style="--c:var(--green)">
          <div class="badge-pop" style="color:var(--green)">${icon('check')}</div>
          <h2 style="color:var(--green);margin-top:8px" class="neon">מעולה, ${escapeHtml(S.name)}!</h2>
          <p class="subtitle">חיזקת בדיוק את הנושאים שהיו קצת יותר מאתגרים — עכשיו הכול ברור, ומגיעה לך התעודה 🎓</p>
          <button class="btn big" id="contBtn">🎖️ לתעודת הסוכן/ת</button>
        </div>`);
    $('#contBtn').onclick=()=>{ sfx.click(); certScreen(); };
    return;
  }
  if(cur.advanced){                                          // advanced challenge round finished
    const earned=S.score-advRoundStartScore;
    const firstTime=!S.advancedDone; S.advancedDone=true; S.advancedPlays=(S.advancedPlays||0)+1;
    const maxed = advancedMaxed();
    delete S.advRound; save();
    cur=null; updateHUD(); sfx.win(); haptic.badge(); burst('var(--purple)'); setTimeout(()=>burst('var(--yellow)'),300);
    const praise = maxed
      ? (firstTime
          ? `מדהים, ${escapeHtml(S.name)}! 🏆 עברת בהצלחה שאלות קשות מכל ${st.challenges.length} תחומי הבטיחות — ברמה שלא כל מבוגר עומד בה. זו ההוכחה הכי טובה שאת/ה יודע/ת להגן על עצמך ברשת. תמשיכ/י ליישם את זה גם בחיים האמיתיים — זה מה שבאמת חשוב. 💙`
          : `זהו זה, ${escapeHtml(S.name)}! 🏆 סיימת ${roundsPhrase(ADVANCED_ROUND_LIMIT)} של האתגר המתקדם — עברת שאלות קשות מכל תחומי הבטיחות, ברמה גבוהה מאוד. זו ההוכחה הכי טובה שאת/ה יודע/ת להגן על עצמך ברשת. תמשיכ/י ליישם את זה גם בחיים האמיתיים — זה מה שבאמת חשוב. 💙`)
      : firstTime
      ? `וואו, ${escapeHtml(S.name)}! 🌟 השקעת מאמץ אמיתי ועברת בהצלחה שאלות מכל ${st.challenges.length} תחומי הבטיחות — ברמה שלא כל מבוגר עומד בה. זו הוכחה שאת/ה באמת יודע/ת להגן על עצמך ברשת.`
      : `שוב הצלחת, ${escapeHtml(S.name)}! 🌟 עוד סבב, עוד הוכחה שהידע שלך על בטיחות ברשת רק מתחזק.`;
    go(`<div class="card center" style="--c:${st.color}">
          <div class="badge-pop">${maxed?icon('trophy'):icon('star')}</div>
          <h2 style="color:var(--purple);margin-top:8px" class="neon">${maxed?'האתגר המתקדם הושלם!':(firstTime?'תג מיוחד הושג!':'סבב נוסף הושלם!')}</h2>
          ${firstTime?`<div style="font-size:20px;font-weight:800;margin-top:6px">מומחה/ית סייבר 🌟</div>`:''}
          <p class="subtitle">${praise}</p>
          <div class="stat-row"><div class="stat"><b>+${earned}</b><span>נק' בסבב</span></div><div class="stat"><b>${S.score}</b><span>סה"כ</span></div></div>
          ${maxed?'<button class="btn adv-btn big" id="downloadAdvBtn">⬇️ הורד/י תעודת אתגר מתקדם</button>':''}
          ${maxed?'':'<button class="btn big" id="advAgainBtn" style="margin-top:10px">🌟 סבב אתגר נוסף</button>'}
          <button class="btn ghost big" id="backBtn" style="margin-top:10px">חזרה למפה 🗺️</button>
        </div>`);
    const dab=$('#downloadAdvBtn'); if(dab) dab.onclick=()=>{ sfx.click(); downloadAdvancedCertificate(); };
    if(!maxed) $('#advAgainBtn').onclick=()=>{ sfx.click(); startAdvanced(); };
    $('#backBtn').onclick=()=>{ sfx.click(); mapScreen(); };
    return;
  }
  if(cur.practice){                                          // replay finished — celebrate, no score/badge change
    cur=null; updateHUD(); sfx.badge(); haptic.badge(); burst(st.color);
    go(`<div class="card center" style="--c:${st.color}">
          <div class="badge-pop">${icon(st.icon)}</div>
          <h2 style="color:${st.color};margin-top:8px" class="neon">כל הכבוד, ${escapeHtml(S.name)}!</h2>
          <p class="subtitle">השלמת שוב את «${st.title}» — תרגול מצוין 💪</p>
          <button class="btn big" id="contBtn">חזרה למפה 🗺️</button>
        </div>`);
    $('#contBtn').onclick=()=>{ sfx.click(); mapScreen(); };
    return;
  }
  if(!S.done.includes(st.id)){ S.done.push(st.id); }
  delete S.partial[st.id];
  if(cur.hadMistake && !S.weakTopics.includes(st.id)) S.weakTopics.push(st.id);
  cur=null; save(); updateHUD(); sfx.badge(); haptic.badge(); burst(st.color);
  const allDone=S.done.length===STATIONS.length;
  const recap = st.challenges.map((c,i)=>`<li style="animation-delay:${i*90}ms">✅ ${shortRecap(c.explain)}</li>`).join('');
  go(`<div class="card center" style="--c:${st.color}">
        <div class="badge-pop">${icon(st.icon)}</div>
        <h2 style="color:${st.color};margin-top:8px" class="neon">תג הושג!</h2>
        <div style="font-size:20px;font-weight:800;margin-top:6px">${st.badgeName}</div>
        <p class="subtitle">כל הכבוד, ${escapeHtml(S.name)}! סיימת את «${st.title}» 🎉</p>
        <div class="stat-row">
          <div class="stat"><b>${S.score}</b><span>נקודות</span></div>
          <div class="stat"><b>${S.done.length}/${STATIONS.length}</b><span>תגים</span></div>
        </div>
        <div class="recap-title">🎬 סיכום מהיר של התחנה</div>
        <ul class="recap-list">${recap}</ul>
        <button class="btn big" id="contBtn">${allDone?'🎖️ לתעודה הסופית':'המשך למפה ▶'}</button>
      </div>`);
  $('#contBtn').onclick=()=>{ sfx.click(); allDone?goToCertOrReview():mapScreen(); };
}

/* ----- Weak-topic review round ----- */
function goToCertOrReview(){
  (S.weakTopics && S.weakTopics.length>0 && !S.reviewDone) ? reviewIntroScreen() : certScreen();
}
function reviewIntroScreen(){
  const topics=S.weakTopics.map(id=>STATIONS.find(s=>s.id===id)).filter(Boolean);
  const chips=topics.map(t=>`<span class="chip" style="--c:${t.color};margin:4px">${icon(t.icon)} ${t.title}</span>`).join('');
  go(`<div class="card center" style="--c:var(--green)">
        <div class="badge-pop" style="color:var(--green)">${icon('shield')}</div>
        <h2 style="margin-top:8px" class="neon">כמעט שם, ${escapeHtml(S.name)}!</h2>
        <p class="subtitle">לפני התעודה, בואו נחזור בקצרה על ${topics.length>1?'הנושאים':'הנושא'} שהיו לך קצת יותר מאתגרים —
        עם שאלות חדשות, כדי לוודא שהכול ברור:</p>
        <div style="margin-top:10px">${chips}</div>
        <button class="btn big" id="reviewBtn" style="margin-top:16px">בואו נבדוק! ▶</button>
      </div>`);
  $('#reviewBtn').onclick=()=>{ sfx.click(); startReviewRound(); };
}
function startReviewRound(){
  const topics=S.weakTopics.map(id=>STATIONS.find(s=>s.id===id)).filter(Boolean);
  const challenges=topics.map(st=>shuffle([...(st.extra&&st.extra.length?st.extra:st.challenges)])[0]);
  reviewStation={ id:'review', title:'סבב חיזוק', icon:'shield', color:'var(--green)', badgeName:'סבב חיזוק', challenges };
  cur={si:'review', ci:0, lives:LIVES, firstTry:true, practice:false, review:true, hadMistake:false};
  renderChallenge();
}

/* ----- Certificate ----- */
/* ---------- certificate image (canvas-rendered PNG, downloads straight to the device) ---------- */
function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawChipsRow(ctx, chips, centerX, y, maxWidth){
  if(!chips.length) return y;
  ctx.font='700 22px Arial, sans-serif';
  const pad=20, gap=12, chipH=44;
  const widths=chips.map(c=>ctx.measureText(c.text).width+pad*2);
  const rows=[]; let row=[], rowW=0;
  widths.forEach((w,i)=>{
    if(rowW+w+gap>maxWidth && row.length){ rows.push(row); row=[]; rowW=0; }
    row.push({...chips[i], w}); rowW+=w+gap;
  });
  if(row.length) rows.push(row);
  let cy=y;
  rows.forEach(r=>{
    const totalW=r.reduce((s,c)=>s+c.w,0)+gap*(r.length-1);
    let x=centerX-totalW/2;
    r.forEach(c=>{
      ctx.fillStyle=c.color; roundRectPath(ctx,x,cy,c.w,chipH,chipH/2); ctx.fill();
      ctx.fillStyle='#0a1128'; ctx.textAlign='center';
      ctx.fillText(c.text, x+c.w/2, cy+chipH/2+8);
      x+=c.w+gap;
    });
    cy+=chipH+12;
  });
  return cy;
}
function drawStatsRow(ctx, stats, centerX, y){
  const boxW=210, boxH=110, gap=20, maxTextW=boxW-24;
  const totalW=stats.length*boxW+(stats.length-1)*gap;
  let x=centerX-totalW/2;
  stats.forEach(s=>{
    ctx.fillStyle='#0a1128'; roundRectPath(ctx,x,y,boxW,boxH,16); ctx.fill();
    ctx.strokeStyle='rgba(120,150,220,.35)'; ctx.lineWidth=2; roundRectPath(ctx,x,y,boxW,boxH,16); ctx.stroke();
    ctx.textAlign='center';
    const text=String(s.value);
    let fontSize=40;
    ctx.font=`900 ${fontSize}px Arial, sans-serif`;
    while(fontSize>18 && ctx.measureText(text).width>maxTextW){ fontSize-=2; ctx.font=`900 ${fontSize}px Arial, sans-serif`; }
    ctx.fillStyle='#00e5ff';
    ctx.fillText(text, x+boxW/2, y+56);
    ctx.fillStyle='#8fa0c8'; ctx.font='600 20px Arial, sans-serif';
    ctx.fillText(s.label, x+boxW/2, y+88);
    x+=boxW+gap;
  });
  return y+boxH;
}
function renderCertificateCanvas(opts){
  const W=900,H=1260;
  const cvs=document.createElement('canvas'); cvs.width=W; cvs.height=H;
  const ctx=cvs.getContext('2d');
  ctx.direction='rtl'; ctx.textAlign='center';
  const theme=opts.theme==='purple' ? {c:'#b388ff'} : {c:'#ffd54f'};
  const grad=ctx.createRadialGradient(W/2,220,60,W/2,220,760);
  grad.addColorStop(0, opts.theme==='purple' ? 'rgba(179,136,255,.20)' : 'rgba(255,213,79,.20)');
  grad.addColorStop(1, '#0d1430');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=theme.c; ctx.lineWidth=10; roundRectPath(ctx,25,25,W-50,H-50,30); ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.15)'; ctx.lineWidth=2; roundRectPath(ctx,42,42,W-84,H-84,22); ctx.stroke();
  ctx.font='130px "Segoe UI Emoji","Noto Color Emoji",sans-serif';
  ctx.fillText(opts.sealEmoji, W/2, 210);
  ctx.fillStyle=theme.c; ctx.font='900 30px Arial, sans-serif';
  ctx.fillText(opts.title, W/2, 290);
  ctx.fillStyle='#8fa0c8'; ctx.font='600 24px Arial, sans-serif';
  ctx.fillText('מוענקת בזאת ל-', W/2, 345);
  ctx.fillStyle=theme.c; ctx.font='900 62px Arial, sans-serif';
  ctx.fillText(opts.name, W/2, 425);
  ctx.fillStyle='#eaf2ff'; ctx.font='800 28px Arial, sans-serif';
  ctx.fillText(opts.roleText, W/2, 475);
  let cy=drawChipsRow(ctx, opts.chips, W/2, 530, W-160);
  cy=drawStatsRow(ctx, opts.stats, W/2, cy+30);
  ctx.fillStyle='#8fa0c8'; ctx.font='500 22px Arial, sans-serif';
  ctx.fillText(opts.dateStr, W/2, cy+60);
  ctx.globalAlpha=.7; ctx.font='500 20px Arial, sans-serif';
  ctx.fillText('סוכני הסייבר — משחק בטיחות ברשת', W/2, H-60);
  ctx.globalAlpha=1;
  return cvs;
}
function downloadCertificateImage(opts, filename){
  const cvs=renderCertificateCanvas(opts);
  cvs.toBlob(blob=>{
    if(!blob) return;
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }, 'image/png');
}

function certScreen(){
  cur=null; updateHUD(); sfx.win(); haptic.badge(); burst('var(--yellow)'); setTimeout(()=>burst('var(--cyan)'),300);
  const badges=STATIONS.map(s=>`<span style="color:${s.color}">${icon(s.icon)}</span>`).join('');
  go(`<div class="cert fade">
        <div class="seal">${icon('trophy')}</div>
        <div class="chip" style="--c:var(--yellow);margin-top:6px">תעודת הסמכה</div>
        <p style="margin:14px 0 2px;color:var(--muted)">מוענקת בזאת ל־</p>
        <div class="name neon">${escapeHtml(S.name)}</div>
        <p style="font-weight:800;font-size:18px">🛡️ סוכן/ת בטיחות סייבר מוסמך/ת 🛡️</p>
        <div class="badges">${badges}</div>
        <div class="stat-row">
          <div class="stat"><b>${S.score}</b><span>נקודות</span></div>
          <div class="stat"><b>${STATIONS.length}/${STATIONS.length}</b><span>תגים</span></div>
          <div class="stat"><b>${TOTAL}</b><span>משימות</span></div>
        </div>
        <p class="subtitle" style="margin-top:8px">עכשיו את/ה יודע/ת לשמור על עצמך ועל חברים ברשת. שתף/י את מה שלמדת! 💙</p>
        <div class="print-date">${new Date().toLocaleDateString('he-IL')}</div>
        <button class="btn adv-btn big no-print" id="downloadBtn" style="margin-top:14px">⬇️ הורד/י תעודה כתמונה</button>
        <button class="btn big no-print" id="advBtn2" style="margin-top:10px">${advancedMaxed()?'🏆 האתגר המתקדם הושלם':'🌟 מוכן/ה לאתגר מתקדם? שאלות קשות יותר'}</button>
        <button class="btn ghost big no-print" id="againBtn" style="margin-top:10px">שחק/י שוב מההתחלה 🔄</button>
        <div class="credit">נוצר ע"י אלון ואורי מרקוביץ</div>
      </div>`);
  $('#downloadBtn').onclick=()=>{
    sfx.click();
    downloadCertificateImage({
      theme:'gold', sealEmoji:'🏆', title:'תעודת הסמכה', name:S.name,
      roleText:'סוכן/ת בטיחות סייבר מוסמך/ת',
      chips: STATIONS.map(s=>({text:s.title.replace('עולם ',''), color:cssColor(s.color)})),
      stats:[{value:S.score,label:'נקודות'},{value:`${STATIONS.length}/${STATIONS.length}`,label:'תגים'},{value:TOTAL,label:'משימות'}],
      dateStr:new Date().toLocaleDateString('he-IL')
    }, `תעודת-סוכן-סייבר-${S.name}.png`);
  };
  $('#advBtn2').onclick=()=>{ sfx.click(); openAdvanced(); };
  $('#againBtn').onclick=()=>{ sfx.click(); if(confirm('להתחיל מחדש ולשחק שוב?')){ S.score=0;S.done=[];S.partial={};S.weakTopics=[];S.reviewDone=false;delete S.advRound;streak=0;save(); startScreen(); } };
}

/* ---------- confetti ---------- */
const cv=$('#confetti'), cx=cv.getContext('2d'); let parts=[];
function sz(){ cv.width=innerWidth; cv.height=innerHeight; } sz(); addEventListener('resize',sz);
function cssColor(v){ if(v&&v.startsWith('var(')){ return getComputedStyle(document.documentElement).getPropertyValue(v.slice(4,-1)).trim()||'#fff'; } return v||'#fff'; }
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
function burst(color){
  if(reduceMotion) return;
  const col=cssColor(color); const cols=[col,'#ffd54f','#00e5ff','#b388ff','#ff5c8a','#00e676'];
  for(let i=0;i<140;i++) parts.push({
    x:innerWidth/2+(Math.random()-.5)*120, y:innerHeight*0.35,
    vx:(Math.random()-.5)*9, vy:Math.random()*-11-3,
    g:.3+Math.random()*.2, s:5+Math.random()*7, r:Math.random()*6,
    vr:(Math.random()-.5)*.4, c:cols[i%cols.length], life:90+Math.random()*40
  });
  if(!raf) tick();
}
let raf=null;
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life--;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.globalAlpha=Math.max(0,p.life/40);
    cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); cx.restore(); });
  parts=parts.filter(p=>p.life>0 && p.y<cv.height+40);
  if(parts.length) raf=requestAnimationFrame(tick); else { raf=null; cx.clearRect(0,0,cv.width,cv.height); }
}

/* ---------- utils ---------- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- crash safety net: never leave the screen stuck/dead ---------- */
window.addEventListener('error', ()=>{
  if(document.querySelector('.fb-overlay')) return; // don't fight an open feedback modal
  try{ mapScreen(); }catch(e){ try{ startScreen(); }catch(e2){} }
});

/* ---------- boot ---------- */
(function boot(){
  const params=new URLSearchParams(location.search);
  const resultsCode=params.get('results'), teacherFlag=params.get('teacher'), classCode=params.get('class'), classNameParam=params.get('cn');
  if(resultsCode) return classResultsScreen(resultsCode);
  if(teacherFlag) return teacherHubScreen();
  if(classCode){
    // Arriving through a class link already answers "are you playing with a class?" — don't ask again,
    // even if the join fetch is still in flight when the kid hits start.
    S.classAsked=true;
    // Show the class name on the very first paint (from the link's ?cn=), so the invitation
    // visibly ties back to the class the teacher named — no need to wait on the join fetch.
    if(classNameParam){ S.classCode=classCode; S.className=classNameParam; }
    save();
    joinClass(classCode).then(cls=>{
      if(cls){ syncStudentProgress(); refreshLogo(); }
    }).catch(()=>{});
  }
  startScreen();
})();

/* ---------- PWA: register service worker ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}
</script>
